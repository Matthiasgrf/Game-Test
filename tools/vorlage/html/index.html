<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/zoom-schutz.js"></script>
<script src="../shared/game-test.js"></script>
<link rel="stylesheet" href="../shared/kit/theme.css">
<title>SPIEL_TITEL</title>
<style>
/* Vorlage für ein Spiel nach docs/GAME_STANDARD.md: Szene bildschirmfüllend (<canvas> in .gt-stage),
   Anzeigen und Steuerung darüber, Fenster für Start, Frage und Ende. Aussehen, Leiste (Pause, Ton, Vollbild,
   Alle Spiele) und Pause-Fenster kommen aus dem Kit. Eigenes Aussehen nur über die Variablen aus theme.css: */
:root {
  /* z. B. --gt-sky-1: #ffd8a8; --gt-primary-1: #8ce99a; --gt-primary-2: #2fb457; */
}
</style>
</head>
<body>
<div class="gt-stage"><canvas id="szene" aria-label="Spielfeld"></canvas></div>

<!-- Anzeigen über der Szene (oben links; oben rechts liegt die Leiste des Kits) -->
<div class="gt-hud" id="hud" hidden>
  <span class="gt-pill" id="fortschritt">⭐ 0 / 0</span>
</div>

<!-- Steuerung für Touch (am Computer ausgeblendet): links ◀ ▶, rechts ▲ ▼ -->
<div class="gt-controls gt-left gt-touch-only" id="steuerung-links" hidden></div>
<div class="gt-controls gt-right gt-touch-only" id="steuerung-rechts" hidden></div>

<section class="gt-screen" data-screen="start">
  <div class="gt-card">
    <div class="gt-emoji" aria-hidden="true">🚀⭐</div>
    <h1>SPIEL_TITEL</h1>
    <p>TODO: In zwei kurzen Sätzen erklären, was zu tun ist.</p>
    <p class="gt-small">💻 Pfeiltasten · 📱 Knöpfe unten oder auf einen Stern tippen</p>
    <div class="gt-row"><button type="button" class="gt-btn" data-action="start">▶ Los geht's!</button></div>
    <div class="gt-row"><a class="gt-btn gt-alt" href="../../#/" target="_top">🏠 Alle Spiele</a></div>
  </div>
</section>

<section class="gt-screen" data-screen="frage" hidden>
  <div class="gt-card" role="dialog" aria-labelledby="frage-text">
    <h2 id="frage-text"></h2>
    <div id="antworten"></div>
    <p class="gt-feedback" id="rueckmeldung" aria-live="polite"></p>
    <div class="gt-row"><button type="button" class="gt-btn" data-action="weiter" hidden>Weiter ➜</button></div>
  </div>
</section>

<section class="gt-screen" data-screen="ende" hidden>
  <div class="gt-card">
    <div class="gt-emoji" aria-hidden="true">🏆</div>
    <h1>Geschafft!</h1>
    <p>Du hast alle Sterne gesammelt. Super gemacht!</p>
    <p id="ergebnis"></p>
    <div class="gt-row"><button type="button" class="gt-btn" data-action="nochmal">🔄 Nochmal spielen</button></div>
    <div class="gt-row"><a class="gt-btn gt-alt" href="../../#/" target="_top">🏠 Alle Spiele</a></div>
  </div>
</section>

<script type="module" src="game.js"></script>
</body>
</html>
