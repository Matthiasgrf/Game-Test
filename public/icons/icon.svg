<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-Icon von Game-Test (Quelle für die PNGs, neu erzeugen mit: node tools/icons.js).
       Himmel und Stern im Stil von „Flug über Europa“; Motiv innerhalb der sicheren Mitte (maskable). -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69b9ee"/>
      <stop offset="1" stop-color="#3b8fd8"/>
    </linearGradient>
    <linearGradient id="stern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <filter id="schatten" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b3a66" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#himmel)"/>
  <path d="M0 392 Q128 324 256 372 T512 352 V512 H0Z" fill="#7bd389"/>
  <path d="M0 440 Q160 388 300 428 T512 416 V512 H0Z" fill="#4fb06d"/>
  <g fill="#fff" opacity=".95">
    <circle cx="128" cy="150" r="34"/><circle cx="166" cy="134" r="44"/><circle cx="206" cy="152" r="30"/>
    <rect x="104" y="148" width="122" height="36" rx="18"/>
    <circle cx="372" cy="112" r="24"/><circle cx="398" cy="100" r="30"/><circle cx="426" cy="114" r="22"/>
    <rect x="356" y="110" width="86" height="26" rx="13"/>
  </g>
  <path filter="url(#schatten)" d="M256 136 L289 222 L381 226 L309 283 L334 372 L256 320 L178 372 L203 283 L131 226 L223 222 Z"
        fill="url(#stern)" stroke="#fff" stroke-width="16" stroke-linejoin="round"/>
</svg>
