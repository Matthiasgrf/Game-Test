<title>Flug über die Welt – Länder und Hauptstädte der Welt</title>
<style>
:root{--mw:150px;--top:max(10px,env(safe-area-inset-top))}
@media(min-width:500px){:root{--mw:180px}}
@media(min-width:900px){:root{--mw:240px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(#69b9ee 0%,#d6ecfb 22%,#d6ecfb 100%);touch-action:none;color:#16324f}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
.hidden{display:none!important}
#left{top:var(--top);left:10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100vw - var(--gt-bar-space) - 20px)}
#mission{background:rgba(255,255,255,.93);border-radius:18px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:100%}
#arrow{width:46px;height:46px;flex:none;transition:transform .08s linear}
#mission .lbl{font-size:12px;opacity:.7;line-height:1}
#mission .tgt{font-size:20px;font-weight:800;line-height:1.15}
#mission .tgt.long{font-size:15px}
#mission .dst{font-size:12px;opacity:.7}
#score{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#mini{top:calc(var(--top) + 58px);right:10px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);border:3px solid #fff;background:#3b9fd8;width:var(--mw);height:auto}
.btnrow{position:fixed;z-index:6;bottom:calc(20px + env(safe-area-inset-bottom))}
.ctl{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.55);border:4px solid rgba(255,255,255,.95);font-size:42px;color:#16324f;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.25);font-weight:900}
.ctl.on{background:rgba(255,200,60,.9)}
#bH,#bN{pointer-events:auto;border-radius:14px;border:3px solid #fff;background:rgba(255,255,255,.85);font-size:14px;font-weight:700;padding:6px 10px;color:#16324f;text-decoration:none;cursor:pointer;font-family:inherit}
#bL{left:16px}#bR{right:16px}
#bB{right:22px;bottom:calc(122px + env(safe-area-inset-bottom));width:70px;height:70px;font-size:30px}
#bM{top:calc(var(--top) + var(--mw) * 0.5 + 16px);right:10px;position:fixed;z-index:6;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.8);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#land{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom));z-index:7;background:linear-gradient(#ffb23f,#ff8a1f);color:#fff;border:4px solid #fff;border-radius:999px;font-size:22px;font-weight:900;padding:16px 26px;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;animation:pulse 1s infinite;max-width:calc(100vw - 230px);font-family:inherit}
@media(max-width:600px){#land{bottom:calc(206px + env(safe-area-inset-bottom));max-width:calc(100vw - 40px);font-size:19px;padding:12px 20px}}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
#toast{position:fixed;z-index:9;top:38%;left:50%;transform:translateX(-50%);background:rgba(20,40,70,.85);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,40,80,.45);padding:12px;touch-action:auto}
.card{background:#fff;border-radius:26px;padding:22px 20px;max-width:560px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center;max-height:96vh;overflow:auto}
.card h1{margin:4px 0 6px;font-size:34px}
.card h2{margin:8px 0 12px;font-size:23px;line-height:1.25}
.card p{margin:8px 0;font-size:17px;line-height:1.4}
.small{font-size:14px;opacity:.7}
.opt{display:block;width:100%;margin:9px 0;padding:14px;font-size:20px;font-weight:800;border-radius:16px;border:3px solid #cfe3f5;background:#f4f9ff;cursor:pointer;color:#16324f;font-family:inherit}
.opt:active{transform:scale(.98)}
.opt.good{background:#b9f3c8;border-color:#2fb457}
.opt.bad{background:#ffd0d0;border-color:#e45a5a;opacity:.65}
.btn{display:inline-block;margin:8px 4px 2px;padding:14px 26px;font-size:21px;font-weight:900;border-radius:999px;border:4px solid #fff;color:#fff;background:linear-gradient(#ffb23f,#ff8a1f);box-shadow:0 5px 14px rgba(0,0,0,.3);cursor:pointer;font-family:inherit}
.btn.alt{background:linear-gradient(#6fb6ee,#3b8fd8);font-size:16px;padding:10px 18px}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flagopt{display:flex;align-items:center;justify-content:center;padding:10px;margin:0;min-height:96px}
.flagopt img{height:72px;width:96px;border:1px solid #bbb;border-radius:4px;pointer-events:none}
.fb{min-height:28px;font-size:18px;font-weight:800;margin-top:4px}
.stars{font-size:44px;letter-spacing:4px}
#ov .bwcard p.bwwhere{font-size:15px;opacity:.8}
#ov .bwcard p.bwinfo{font-size:18px;text-align:left;background:#fff6e0;border-radius:14px;padding:10px 14px}
#loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;background:linear-gradient(#69b9ee,#d6ecfb);text-align:center;padding:20px}
</style>

var BWBUILD={bw_gizeh:mkGizeh,bw_mauer:mkMauer,bw_kolosseum:mkKolosseum,bw_hagia:mkHagia,bw_angkor:mkAngkor,bw_taj:mkTaj,bw_eiffel:mkEiffel,bw_sagrada:mkSagrada,bw_empire:mkEmpire,bw_burj:mkBurj};
function buildBW(){
  var ringGeo=new THREE.TorusGeometry(0.5,0.07,8,28),gemGeo=new THREE.OctahedronGeometry(0.22);
  BW.forEach(function(b){
    var g=new THREE.Group(),model=new THREE.Group(),sc=b.sc||1;
    BWBUILD[b.id](model,b);
    model.scale.setScalar(sc);g.add(model);
    b.pad=[b.pad[0]*sc,b.pad[1]*sc];b.h*=sc;b.cd*=sc;
    /* Landeplatz: goldener Ring, darüber ein schwebender Edelstein */
    var mat=new THREE.MeshLambertMaterial({color:0xffb300,emissive:0x553300});
    var ring=new THREE.Mesh(ringGeo,mat);ring.rotation.x=Math.PI/2;ring.position.set(b.pad[0],0.07,b.pad[1]);
    var gem=new THREE.Mesh(gemGeo,mat);gem.position.set(b.pad[0],0.9,b.pad[1]);
    g.add(ring,gem);
    b.bx=wx(b.lon);b.x=b.bx;b.z=wz(b.lat);
    g.position.set(b.x,0,b.z);scene.add(g);
    b.group=g;b.mat=mat;b.gem=gem;
    b.pin={bx:b.bx+b.pad[0],x:b.bx+b.pad[0],z:b.z+b.pad[1],bw:b};
    /* Kamera beim Landen: hinter dem Landeplatz, leicht seitlich, mit Blick auf das Bauwerk */
    var l=Math.hypot(b.pad[0],b.pad[1]),ux=b.pad[0]/l,uz=b.pad[1]/l;
    b.cx=ux*b.cd-uz*b.cd*0.45;b.cz=uz*b.cd+ux*b.cd*0.45;b.cy=b.h*0.5+1.3;b.ly=b.h*0.4;
    b.label=makeLabel(b.name,0.75,'#8a3b00');b.label.position.set(b.x,b.h+0.75,b.z);scene.add(b.label);
  });
  refreshBW();
}
function refreshBW(){
  BW.forEach(function(b){var v=!!bwSeen[b.id];b.mat.color.setHex(v?0x35c26b:0xffb300);b.mat.emissive.setHex(v?0x0a2a12:0x553300);b.gem.visible=!v;});
}
function bwCount(){return BW.filter(function(b){return bwSeen[b.id];}).length;}
function updateBW(t){
  for(var i=0;i<BW.length;i++){
    var b=BW[i];
    b.x=nearX(b.bx);b.pin.x=b.x+b.pad[0];
    var dx=b.x-P.x,dz=b.z-P.z,d=Math.sqrt(dx*dx+dz*dz);
    b.group.position.x=b.x;b.group.visible=b.id==='bw_mauer'||d<80;
    b.gem.position.y=0.9+0.12*Math.sin(t*3+i);b.gem.rotation.y=t*1.5;
    var op=Math.max(0,Math.min(1,1.5-d/22));
    b.label.position.x=b.x;b.label.material.opacity=op;b.label.visible=op>0.02;
  }
}
/* Flughöhe: über hohen Bauwerken steigt das Flugzeug von selbst nach oben */
function cruiseY(){
  var y=3.2;
  for(var i=0;i<BW.length;i++){
    var b=BW[i];if(b.h<2.5)continue;
    var dx=nearX(b.bx)-P.x,dz=b.z-P.z,d=Math.sqrt(dx*dx+dz*dz);
    if(d<6.5){var f=Math.min(1,(6.5-d)/3);f=f*f*(3-2*f);y=Math.max(y,3.2+(b.h+1.1-3.2)*f);}
  }
  return y;
}

/* Flaggen: Bilder aus assets/vendor (flag-icons), kein fremder Server */
var flagOK={};
function flagURL(c){return FLAGS+c.id.toLowerCase()+'.svg';}
function loadFlags(list,cb){
  var todo=list.filter(function(c){return flagOK[c.id]===undefined;}),n=todo.length,finished=false;
  function done(){if(finished)return;finished=true;cb(list.every(function(c){return flagOK[c.id];}));}
  if(!n){done();return;}
  todo.forEach(function(c){
    var im=new Image();
    im.onload=function(){flagOK[c.id]=true;if(--n===0)done();};
    im.onerror=function(){flagOK[c.id]=false;if(--n===0)done();};
    im.src=flagURL(c);
  });
  setTimeout(function(){if(!finished){todo.forEach(function(c){if(flagOK[c.id]===undefined)delete flagOK[c.id];});finished=true;cb(false);}},8000);
}
function fmtPop(n){
  var m=Math.pow(10,Math.floor(Math.log(n)/Math.LN10+1e-9)-1);
  n=Math.round(n/m)*m;
  function num(v){var s=v>=100?String(Math.round(v)):v.toFixed(1).replace('.',',');if(s.slice(-2)===',0')s=s.slice(0,-2);return s;}
  if(n>=1e9){var b=num(n/1e9);return 'ca. '+b+(b==='1'?' Milliarde':' Milliarden');}
  if(n>=1e6){var s=num(n/1e6);return 'ca. '+s+(s==='1'?' Million':' Millionen');}
  if(n>=1000)return 'ca. '+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return 'ca. '+Math.round(n);
}
function popOpts(c){
  var correct=fmtPop(c.pop),seen={},items=[{v:c.pop,s:correct}];
  seen[correct]=1;
  var mult=shuffle([0.15,0.25,0.4,0.6,1.7,2.5,4,7]);
  for(var i=0;i<mult.length&&items.length<4;i++){
    var v=c.pop*mult[i];
    if(v>2.5e9)continue;
    var s=fmtPop(v);
    if(!seen[s]){seen[s]=1;items.push({v:v,s:s});}
  }
  items.sort(function(a,b){return a.v-b.v;});
  return {ans:correct,opts:items.map(function(x){return x.s;})};
}
function buildQs(c){
  var others=C.filter(function(x){return x!==c;});
  var qs=[];
  qs.push({type:'flag',t:'Welche Flagge gehört '+prep('zu',c)+'?',ans:c.id,flags:shuffle(shuffle(others.filter(function(x){return TWINS[c.id]!==x.id;})).slice(0,3).concat([c]))});
  var caps=shuffle(others.filter(function(x){return x.cap!==c.cap;})).slice(0,3).map(function(x){return x.cap;});
  qs.push({t:'Wie heißt die Hauptstadt '+prep('von',c)+'?',ans:c.cap,opts:shuffle(caps.concat([c.cap]))});
  var lms=shuffle(others).slice(0,3).map(function(x){return x.lm;});
  qs.push({t:'Welche Sehenswürdigkeit gibt es in '+c.cap+'?',ans:c.lm,opts:shuffle(lms.concat([c.lm]))});
  var po=popOpts(c);
  qs.push({t:'Wie viele Menschen leben ungefähr '+prep('in',c)+'?',ans:po.ans,opts:po.opts});
  return qs;
}
function startLanding(c){

function openQuiz(c,qs){
  var qi=0,mistakes=0,gained=0,first=!visited[c.id];
  var ov=$('ov');ov.classList.remove('hidden');
  function next(){qi++;if(qi<qs.length)showQ();else finish();}
  function showQ(){
    var q=qs[qi];
    if(q.type==='flag'){
      ov.innerHTML='<div class="card"><h2>🏳️ Flaggen werden geladen …</h2></div>';
      loadFlags(q.flags,function(ok){if(!ok){next();return;}renderQ(q);});
    }else renderQ(q);
  }
  function renderQ(q){
    var tries=0,done=false;
    ov.innerHTML='';
    var card=document.createElement('div');card.className='card';
    var sm=document.createElement('div');sm.className='small';sm.textContent='🛬 Gelandet '+prep('in',c)+'!  ·  Aufgabe '+(qi+1)+' von '+qs.length;
    var h=document.createElement('h2');h.textContent=q.t;
    var wrap=document.createElement('div');
    var fb=document.createElement('div');fb.className='fb';
    card.appendChild(sm);card.appendChild(h);card.appendChild(wrap);card.appendChild(fb);ov.appendChild(card);
    function answer(b,ok){
      if(done||b.disabled)return;
      if(ok){
        done=true;b.classList.add('good');
        var pts=tries===0?10:(tries===1?5:(tries===2?2:0));
        if(first)gained+=pts;
        mistakes+=tries;
        fb.textContent=tries===0?'✅ Richtig! Super!':'✅ Richtig!';
        tone([660,880]);
        setTimeout(next,1100);
      }else{
        tries++;b.classList.add('bad');b.disabled=true;
        fb.textContent='Fast! Probier es nochmal 🙂';tone([220]);
      }
    }
    if(q.type==='flag'){
      wrap.className='flags';
      q.flags.forEach(function(f){
        var b=document.createElement('button');b.className='opt flagopt';
        var im=document.createElement('img');im.src=flagURL(f);im.alt='Flagge';
        b.appendChild(im);
        b.addEventListener('click',function(){answer(b,f.id===q.ans);});

      });
    }else{
      q.opts.forEach(function(o){
        var b=document.createElement('button');b.className='opt';b.textContent=o;
        b.addEventListener('click',function(){answer(b,o===q.ans);});
        wrap.appendChild(b);
      });
    }
  }
  function finish(){
    var stars=mistakes===0?3:(mistakes<=3?2:1);
    if(first){visited[c.id]=stars;score+=gained;save();melde();}
    else if(stars>(visited[c.id]||0)){visited[c.id]=stars;save();}
    updateScore();refreshPins();
    tone([523,659,784,1047]);
    ov.innerHTML='';
    var card=document.createElement('div');card.className='card';
    var all=visitedCount()>=NC;
    card.innerHTML='<div class="stars">'+'⭐'.repeat(stars)+'<span style="opacity:.25">'+'⭐'.repeat(3-stars)+'</span></div>'+
      '<h2>Geschafft: '+c.name+'!</h2>'+
      '<p>🌍 Kontinent: <b>'+c.cont+'</b></p>'+
      '<p>🏙️ Die Hauptstadt '+prep('von',c)+' ist <b>'+c.cap+'</b>.</p>'+
      '<p>📍 Dort gibt es: <b>'+c.lm+'</b></p>'+
      '<p class="small">'+(first?('+'+gained+' Punkte'):'Geübt – Punkte gibt es nur beim ersten Mal')+'</p>';
    var b=document.createElement('button');b.className='btn';b.textContent=all?'🏆 Zum Ziel!':'Weiterfliegen ✈️';
    b.addEventListener('click',function(){
      ov.classList.add('hidden');
      if(all){showWin();return;}
      if((target&&target.id===c.id)||!target)chooseTarget(false);
      refreshPins();
      state='fly';
    });
    card.appendChild(b);ov.appendChild(card);

}

/* ---------- Hauptschleife ---------- */
var camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),dp=new THREE.Vector3(),dl=new THREE.Vector3();
var BZ0=wz(78),BZ1=wz(-55);
var R_LAND=2.3;
var arrow=$('arrow'),miniCtx=$('mini').getContext('2d'),lastClampToast=0,hudT=0;
function mod(a,n){return ((a%n)+n)%n;}
/* Entfernung auf der Erdkugel in km */
function km(lon1,lat1,lon2,lat2){
  var r=Math.PI/180,a=Math.sin((lat2-lat1)*r/2),b=Math.sin((lon2-lon1)*r/2);
  var h=a*a+Math.cos(lat1*r)*Math.cos(lat2*r)*b*b;
  return 12742*Math.asin(Math.min(1,Math.sqrt(h)));
}

function update(dt,t){
  uniforms.uTime.value=t;
  var flying=(state==='fly'||state==='menu'),i,c,yT=3.2;
  var tgtTurn=0;
  if(state==='menu'){tgtTurn=0.28;}
  else if(state==='fly'){tgtTurn=(input.right?1:0)-(input.left?1:0);}
  if(flying){
    P.turn+=(tgtTurn-P.turn)*Math.min(1,dt*6);
    P.yaw+=P.turn*1.3*dt;
    var sp=7*(input.boost?2.4:(input.slow?0.5:1));
    P.x+=Math.sin(P.yaw)*sp*dt;P.z-=Math.cos(P.yaw)*sp*dt;
    yT=cruiseY();
    P.y+=(yT-P.y)*Math.min(1,dt*(yT>P.y?3:1.6));
    var cz=Math.min(BZ1,Math.max(BZ0,P.z));
    if(cz!==P.z&&state==='fly'&&t-lastClampToast>2.5){toast('Brr, hier ist es zu kalt – dreh um! 🥶');lastClampToast=t;}
    P.z=cz;
  }else if(state==='landing'||state==='quiz'||state==='win'){
    P.turn+=(0-P.turn)*Math.min(1,dt*4);
    if(curPin){var k=Math.min(1,dt*2.4);P.x+=(curPin.x-P.x)*k;P.z+=(curPin.z-P.z)*k;}
    P.y+=(0.55-P.y)*Math.min(1,dt*2.2);
  }
  var pitch=Math.max(-0.35,Math.min(0.3,(yT-P.y)*0.12*(flying?1:-1)));
  if(!flying)pitch=Math.max(-0.3,Math.min(0.2,(P.y-0.55)*-0.08));
  plane.position.set(P.x,P.y,P.z);
  plane.rotation.set(pitch,-P.yaw,-P.turn*0.6);
  prop.rotation.z+=dt*45;
  shadow.position.set(P.x,0.05,P.z);shadow.rotation.z=-P.yaw;
  var ss=Math.max(0.5,1.3-P.y*0.12);shadow.scale.set(ss*1.7,ss,1);

  /* Die drei Karten, Pins und das Meer zum Flugzeug holen */
  var k0=Math.round(P.x/MW);
  for(i=0;i<3;i++)WORLDS[i].position.x=(k0+i-1)*MW;
  seaMesh.position.x=P.x;seaMesh.position.z=P.z;
  for(i=0;i<NC;i++){c=C[i];c.pin.x=nearX(c.pin.bx);c.pin.group.position.x=c.pin.x;}
  updateBW(t);

  /* Nähe zu Hauptstadt – das Ziel-Land hat Vorrang, wenn mehrere Hauptstädte dicht beieinander liegen */
  if(state==='fly'){
    var best=null,bd=1e9;
    for(i=0;i<NC;i++){var p=C[i].pin,dx=p.x-P.x,dz=p.z-P.z,d=dx*dx+dz*dz;
      if(C[i]===target&&d<R_LAND*R_LAND)d=-1;
      if(d<bd){bd=d;best=C[i];}}
    for(i=0;i<BW.length;i++){var bp=BW[i].pin,bdx=bp.x-P.x,bdz=bp.z-P.z,bd2=bdx*bdx+bdz*bdz;if(bd2<bd){bd=bd2;best=BW[i];}}
    if(lockId){var lp=(BYID[lockId]||BWBY[lockId]).pin,ddx=lp.x-P.x,ddz=lp.z-P.z;if(ddx*ddx+ddz*ddz>(R_LAND+1.2)*(R_LAND+1.2))lockId=null;}
    if(best&&bd<R_LAND*R_LAND&&best.id!==lockId){
      if(nearC!==best){nearC=best;$('land').textContent='🛬 '+(best.pin.bw?best.at:cap1(prep('in',best)))+' landen';$('land').classList.remove('hidden');}
    }else if(nearC){nearC=null;$('land').classList.add('hidden');}
  }

  /* Kamera */
  if(state==='landing'||state==='quiz'||state==='win'){
    var cp=curPin||{x:P.x,z:P.z};
    if(cp.bw){var cb=cp.bw;dp.set(cb.x+cb.cx,cb.cy,cb.z+cb.cz);dl.set(cb.x,cb.ly,cb.z);}
    else{dp.set(cp.x+3.2,1.9,cp.z+4.4);dl.set(cp.x,0.8,cp.z);}
  }else{
    var fx=Math.sin(P.yaw),fz=-Math.cos(P.yaw);
    dp.set(P.x-fx*6.8,P.y+2.7,P.z-fz*6.8);dl.set(P.x+fx*9,P.y-1.0,P.z+fz*9);
  }
  var kk=1-Math.exp(-dt*(flying?7:2.2));
  camPos.lerp(dp,kk);camLook.lerp(dl,kk);
  camera.position.copy(camPos);camera.lookAt(camLook);

  /* Pins, Strahl, Beschriftungen, Wolken */
  var pulse=1+0.18*Math.sin(t*5);
  for(i=0;i<NC;i++){
    c=C[i];
    c.pin.ball.scale.setScalar(c===target?pulse*1.25:1);
    c.pin.ring.scale.setScalar(c===target?1+0.25*Math.sin(t*4):1);
    var lx=nearX(c.lbx),ddx2=lx-P.x,ddz2=c.lz-P.z;
    var op=Math.max(0,Math.min(1,1.25-Math.sqrt(ddx2*ddx2+ddz2*ddz2)/17));
    if(state!=='fly'&&curPin&&curPin.bw)op=0; /* beim Bauwerk: Ländernamen verdecken sonst die Sicht */
    if(op>0.02&&!c.label){c.label=makeLabel(c.short,c.lSize);c.label.position.set(lx,0.75+c.lSize*0.25,c.lz);scene.add(c.label);}
    if(c.label){c.label.position.x=lx;c.label.material.opacity=op;c.label.visible=op>0.02;}
  }
  var beam=window.__beam;
  if(target){beam.position.x=target.pin.x;beam.position.z=target.pin.z;var bdx=target.pin.x-camera.position.x,bdz=target.pin.z-camera.position.z,bdd=Math.sqrt(bdx*bdx+bdz*bdz);beam.material.opacity=(0.3+0.12*Math.sin(t*4))*Math.min(1,Math.max(0,(bdd-3)/4));}
  window.__clouds.forEach(function(cl){
    cl.userData.ox+=cl.userData.v*dt;
    cl.position.x=P.x+mod(cl.userData.ox-P.x,CW)-CW/2;
    cl.position.z=P.z+mod(cl.userData.oz-P.z,CW)-CW/2;
  });

  /* HUD */
  if(target&&(state==='fly'||state==='menu')){
    var tx=target.pin.x-P.x,tz=target.pin.z-P.z;
    var bearing=Math.atan2(tx,-tz);
    arrow.style.transform='rotate('+((bearing-P.yaw)*180/Math.PI).toFixed(1)+'deg)';
    if(t-hudT>0.25){
      hudT=t;
      var d=km(mod(P.x/KX+180,360)-180,LATC-P.z/KY,target.cLon,target.cLat);
      $('tgtDist').textContent=target.cont+' · ca. '+(d<1000?Math.round(d/10)*10:Math.round(d/100)*100)+' km';
    }
  }
  drawMini(t);
}
function drawMini(t){
  if(!window.__mini||$('mini').classList.contains('hidden'))return;
  var cv=$('mini'),w=cv.width,h=cv.height;
  miniCtx.drawImage(window.__mini,0,0,w,h);
  function m(x,z){return [mod(x/MW+0.5,1)*w,(z+MH/2)/MH*h];}
  var p,i,c;
  for(i=0;i<NC;i++){
    c=C[i];p=m(c.pin.bx,c.pin.z);
    if(visited[c.id]){miniCtx.fillStyle='#0f7a3a';miniCtx.fillRect(p[0]-2,p[1]-2,4,4);}
    else{miniCtx.fillStyle='rgba(255,255,255,.85)';miniCtx.fillRect(p[0]-1,p[1]-1,2,2);}
  }
  drawMiniBW(m);
  if(target){
    var q=m(target.pin.bx,target.pin.z),r=7+4*Math.abs(Math.sin(t*4));
    miniCtx.beginPath();miniCtx.arc(q[0],q[1],r,0,6.283);miniCtx.lineWidth=3;miniCtx.strokeStyle='#ff9f1c';miniCtx.stroke();
    miniCtx.beginPath();miniCtx.arc(q[0],q[1],2.5,0,6.283);miniCtx.fillStyle='#ffd23f';miniCtx.fill();
  }
  var pp=m(P.x,P.z);
  miniCtx.save();miniCtx.translate(pp[0],pp[1]);miniCtx.rotate(P.yaw);
  miniCtx.beginPath();miniCtx.moveTo(0,-11);miniCtx.lineTo(8,9);miniCtx.lineTo(0,5);miniCtx.lineTo(-8,9);miniCtx.closePath();
  miniCtx.fillStyle='#e53935';miniCtx.fill();miniCtx.lineWidth=2;miniCtx.strokeStyle='#fff';miniCtx.stroke();miniCtx.restore();
}

function frame(now){
  raf=0;
  if(paused)return;                      /* Pause: kein Zeichnen, das Gerät bleibt kühl */
  raf=requestAnimationFrame(frame);
  /* Menü und offene Fenster (Fragen, Gewinn): die Szene lebt nur mit 20 Bildern/s weiter */
  if(state!=='fly'&&state!=='landing'&&now&&now-lastDraw<50)return;
  lastDraw=now||0;
  var raw=clock.getDelta(),dt=Math.min(raw,0.05);
  if(quality&&state==='fly')quality.frame(raw);
  update(dt,clock.elapsedTime);
  renderer.render(scene,camera);
}

/* ---------- Game-Test-Kit (public/games/shared/kit/): Leiste mit Pause, Ton, Vollbild und
   „Alle Spiele“, Pause-Fenster, automatische Pause im Hintergrund, Detailstufe auf schwachen Geräten.
   Der Ton-Knopf der Leiste schaltet die gemeinsame Ton-Einstellung aller Spiele (muted). ---------- */
var kit=null,quality=null,paused=false,raf=0,lastDraw=0;
function kitState(){if(kit)kit.setState(state==='menu'||state==='loading'?'menu':state==='win'?'end':'play');}
import('../shared/kit/kit.js').then(function(m){
  kit=m.startKit({key:'weltflug',orientation:'any',
    pause:function(){paused=true;},
    resume:function(){paused=false;clock.getDelta();if(!raf)frame();},
    sound:{setMuted:function(v){muted=v;}}});
  quality=m.createQuality({renderer:renderer});
  kitState();
}).catch(function(){});

/* ---------- Start ---------- */
load();
/* Zugang für den Durchspiel-Test (tools/spieltests/weltflug.js), nur mit ?test in der Adresse */
if(/[?&]test\b/.test(location.search))window.WELTFLUG={P:P,BW:BW,C:C,state:function(){return state;},near:function(){return nearC&&nearC.id;}};
setTimeout(function(){
  try{
    buildMap();buildWorld();buildBW();
  }catch(e){
    $('loading').textContent='Leider ist beim Laden ein Fehler passiert: '+e.message;
    return;
  }
  /* Kamera sofort hinter das Flugzeug setzen */
  var fx=Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  camPos.set(P.x-fx*6.8,P.y+2.7,P.z-fz*6.8);camLook.set(P.x+fx*9,P.y-1.0,P.z+fz*9);
  state='menu';
  updateScore();
  $('loading').classList.add('hidden');
  showStart();
  frame();
},60);
})();
</script>
