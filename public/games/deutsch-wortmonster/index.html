<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/zoom-schutz.js"></script>
<script src="../shared/game-test.js"></script>
<title>Die Wortmonster</title>
<style>
/* Die Wortmonster – Deutsch, 3. Klasse: Übung für den Sprachkundetest.
   Drei Monster fressen je eine Wortart: Nomi (Nomen), Flitz (Verben), Ada (Adjektive).
   Inhalte stammen von vier Arbeitsblättern (Artikel, Verben, Adjektive, Sprachkundetest) und weiteren Wörtern. */
:root{--ink:#22204a;--accent:#ff6f3c;--ok:#2fa84f;--bad:#e2504a;--paper:#fffdf7;--line:#e4dcf5;--n:#4a90e2;--v:#ff8a1f;--a:#b05bd6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  background:radial-gradient(circle,rgba(255,255,255,.35) 3px,transparent 3.5px) 0 0/34px 34px,linear-gradient(160deg,#7bd8c9,#a8c8ff 50%,#f7c6e8)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 4px}
.pill{background:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:16px;color:inherit;
  text-decoration:none;box-shadow:0 3px 10px rgba(40,30,90,.22);display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:42px;white-space:nowrap}
.bar .pill{min-width:0}
#progress{overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.bar{gap:6px;padding-left:8px;padding-right:8px}.bar .pill{padding:8px 10px;font-size:15px}}
main{flex:1;display:flex;flex-direction:column;padding:6px 12px calc(16px + env(safe-area-inset-bottom))}
.card{margin:auto;background:var(--paper);border-radius:24px;padding:20px;width:100%;box-shadow:0 8px 26px rgba(40,30,90,.25);border:3px solid #fff}
h1{margin:2px 0 6px;font-size:clamp(30px,6vw,44px);text-align:center;letter-spacing:.5px}
h1 span{display:inline-block}
p{font-size:18px;line-height:1.4;margin:8px 0}
.btn{display:block;width:100%;margin:10px 0 0;padding:13px 18px;min-height:54px;font:inherit;font-size:19px;font-weight:700;text-align:center;
  color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;cursor:pointer;text-decoration:none}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 0 #c94d22}
.btn.main:active{transform:translateY(3px);box-shadow:0 1px 0 #c94d22}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,.mon:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Monster ---------- */
.msvg{display:block;width:100%;height:auto;overflow:visible}
.msvg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.msvg .mo{display:none}
.eat .msvg .mo{display:inline}.eat .msvg .mc{display:none}
.wig{animation:idle 2.6s ease-in-out infinite;transform-origin:50% 100%}
[data-m="v"] .wig{animation:hop .7s ease-in-out infinite}
[data-m="v"] .legL{animation:legs .35s infinite alternate;transform-box:fill-box;transform-origin:top center}
[data-m="v"] .legR{animation:legs .35s infinite alternate-reverse;transform-box:fill-box;transform-origin:top center}
[data-m="a"] .skin{animation:rainbow 7s linear infinite}
.chew .wig{animation:chew .28s ease-in-out 3}
.yuck .wig{animation:shake .5s ease-in-out}
.burp .wig{animation:burp .8s ease-in-out}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes idle{50%{transform:translateY(-5px) scale(1.02,.98)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes legs{to{transform:rotate(14deg)}}
@keyframes rainbow{0%,100%{fill:#b05bd6}25%{fill:#e45fb4}50%{fill:#b05bd6}75%{fill:#7466e8}}
@keyframes chew{50%{transform:scale(1.08,.9)}}
@keyframes shake{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes burp{30%{transform:scale(1.25,.85)}60%{transform:scale(.95,1.1)}}

/* ---------- Start ---------- */
.start{max-width:860px}
.intro{text-align:center;max-width:600px;margin:0 auto 12px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.area{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 10px 12px;font:inherit;color:inherit;background:#fff;
  border:4px solid var(--line);border-radius:20px;cursor:pointer;text-align:center;transition:transform .15s}
.area:hover{transform:translateY(-3px)}
.area .pic{width:110px;height:110px;display:flex;align-items:flex-end;justify-content:center}
.area .pic .one{width:104px}
.area .pic .one{display:block}.area .pic .three{display:flex;align-items:flex-end;gap:2px}.area .pic .three>span{display:block;width:44px}
.area b{font-size:21px}
.area small{font-size:15px;opacity:.8;line-height:1.25}
.area .st{font-size:17px;margin-top:4px;min-height:22px;letter-spacing:2px}
.area[data-area="nomen"]{border-color:#a9cdf6;background:#f1f7ff}
.area[data-area="verben"]{border-color:#ffc58f;background:#fff5ea}
.area[data-area="adjektive"]{border-color:#dcb3ef;background:#fbf2ff}
.area[data-area="mix"]{border-color:#9edcc3;background:#ecfbf4}
.testbtn{margin-top:14px}
.testbtn small{display:block;font-size:15px;font-weight:400;opacity:.95}

/* ---------- Spiel ---------- */
#game{max-width:860px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;flex:1}
#stage{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,4vw,40px);min-height:130px;padding-top:34px}
.mon{position:relative;width:clamp(78px,20vw,112px);display:flex;flex-direction:column;align-items:center;cursor:default;border-radius:18px;
  transition:background .2s}
#stage.one .mon{width:clamp(110px,28vw,150px)}
.mon .grow{width:100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%}
.mon .mname small{font-size:inherit}
#stage:not(.one) .dot{display:none}
#stage:not(.one) .mname small{display:block;font-size:12px;line-height:1.1}
#stage:not(.one) .mname{border-radius:12px;text-align:center;padding:2px 8px}
.mon .mname{font-weight:700;font-size:15px;background:rgba(255,255,255,.85);border-radius:999px;padding:2px 10px;margin-top:2px;white-space:nowrap}
.mon.target{cursor:pointer}
.mon.target .mname{border:2px dashed currentColor}
.mon.hot{background:rgba(255,255,255,.55)}
.mon.sel .mname{background:#ffe680}
.bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:4px 10px;font-weight:700;font-size:15px;white-space:nowrap;z-index:5;pointer-events:none;animation:pop .25s}
.bub::after{content:"";position:absolute;top:100%;left:calc(50% + var(--tail,0px));margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink)}
@keyframes pop{from{transform:translateX(-50%) scale(.3)}}
.belly{height:14px;background:rgba(255,255,255,.6);border-radius:999px;overflow:hidden;border:2px solid #fff;max-width:420px;width:100%;margin:0 auto}
.belly div{height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff6f3c);border-radius:999px;transition:width .5s}
.play{margin:0 auto;max-width:860px;padding:16px 18px}
.kicker{text-align:center;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.65}
#prompt{margin:2px 0 12px;font-size:clamp(21px,3.4vw,27px);line-height:1.25;text-align:center}
#task{font-size:clamp(20px,3.4vw,25px);line-height:2;text-align:center}
.gap{display:inline-block;min-width:3.6em;min-height:1.45em;line-height:1.3;padding:0 6px;margin:0 2px;border-bottom:3px dashed #a39bc4;vertical-align:baseline;
  border-radius:6px;font-weight:700;text-align:center}
.gap.sm{min-width:1.4em}
.gap.cur{background:#fff3a6;border-bottom-color:var(--accent);animation:glow 1.2s ease-in-out infinite}
.gap.done{color:var(--ok);border-bottom-style:solid;border-bottom-color:var(--ok)}
.gap.fix{color:var(--bad);border-bottom-style:solid;border-bottom-color:var(--bad)}
@keyframes glow{50%{background:#ffe066}}
.line{display:block;text-align:left;max-width:560px;margin:0 auto}
.lbl{display:inline-block;font-size:.62em;font-weight:700;background:#eee8ff;border-radius:8px;padding:2px 8px;vertical-align:middle;margin-right:6px;
  line-height:1.5;min-width:8.5em;text-align:center}
.given{display:inline-block;font-weight:700;background:#fff;border:3px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:6px}
.txt{text-align:left;max-width:640px;margin:0 auto;line-height:2.1}
#opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.co{min-width:72px;min-height:54px;padding:8px 18px;font:inherit;font-size:21px;font-weight:700;color:var(--ink);background:#fff;
  border:3px solid #cfc6ee;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 #cfc6ee;touch-action:manipulation}
.co:hover{border-color:var(--accent)}
.co.wrong{background:#ffe1dc;border-color:var(--bad);box-shadow:none;animation:shake2 .4s;cursor:default;opacity:.7}
.co.used{visibility:hidden}
@keyframes shake2{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Wörter im Satz antippen */
.sent{max-width:680px;margin:0 auto;line-height:2.3}
.tw{font:inherit;font-size:inherit;color:inherit;background:#fff;border:2px solid #ddd5f3;border-radius:10px;padding:0 6px;margin:2px 1px;cursor:pointer;
  line-height:1.5;touch-action:manipulation}
.tw.hit{background:#d6f5dc;border-color:var(--ok);color:#1d6b33;font-weight:700}
.tw.miss{background:#ffe1dc;border-color:var(--bad);animation:shake2 .4s}
.tw.hint{animation:glow 1s infinite;border-color:var(--accent)}
.count{font-size:16px;font-weight:700;opacity:.7;margin-top:4px}
/* Wörterschlange */
.snake{max-width:720px;margin:0 auto;padding:4px;text-align:center;font-size:20px;line-height:66px}
.seg{display:inline;background:linear-gradient(#8fdc6f,#55b84a);border:3px solid #2f7d35;border-radius:999px;padding:7px 8px;margin:0 2px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg .eye{font-size:24px;margin-right:2px;vertical-align:middle}
.sl{display:inline-block;vertical-align:middle;font:inherit;font-weight:700;font-size:clamp(20px,4.6vw,26px);color:#173d1c;background:transparent;border:0;border-radius:8px;min-width:.8em;padding:4px 1px;
  cursor:pointer;touch-action:manipulation;line-height:1.3}
.sl:hover{background:rgba(255,255,255,.5)}
.sl.miss{background:#ffb4aa;animation:shake2 .4s}
.sl.hint{background:#fff3a6;animation:glow 1s infinite}
.seg.cutoff{margin-left:16px}
/* Wörter sortieren */
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:#fff;border:3px solid #cfc6ee;border-radius:14px;padding:8px 16px;min-height:52px;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #cfc6ee}
.chip.sel{background:#fff3a6;border-color:var(--accent);transform:translateY(-4px)}
.chip.miss{background:#ffe1dc;border-color:var(--bad);animation:shake2 .4s}
.chip.drag{position:fixed;z-index:50;pointer-events:none;opacity:.95;transform:scale(1.1);margin:0}
.chip.ghost{opacity:.3}
.howto{font-size:16px;opacity:.75;margin:10px 0 0;text-align:center}
/* Siegerpodest */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;max-width:600px;margin:0 auto;line-height:1.3}
.step{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;border-radius:14px 14px 4px 4px;color:#fff;padding:8px 4px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.step .gap{background:rgba(255,255,255,.95);color:var(--ink);min-width:4.5em;font-size:clamp(17px,3.4vw,23px);border-bottom-color:#fff}
.step .gap.cur{background:#fff3a6}
.step small{font-size:13px;font-weight:700;letter-spacing:.3px}
.step b{font-size:22px}
.s0{background:#b9a6e4;min-height:96px}.s1{background:#9d7ce0;min-height:132px}.s2{background:#7d55d4;min-height:168px}
#fb{min-height:30px;font-weight:700;font-size:18px;text-align:center;margin:12px 0 0}
#fb.ok{color:#1d7a3a}#fb.no{color:#b23a33}
#fb .exp{display:block;font-weight:400;color:var(--ink);margin-top:4px}
.flyer{position:fixed;z-index:60;pointer-events:none;font-weight:700;font-size:22px;background:#fff3a6;border:3px solid var(--accent);border-radius:12px;
  padding:4px 10px;transition:transform .45s cubic-bezier(.5,-0.3,.7,.6),opacity .45s;white-space:nowrap}

/* ---------- Ende ---------- */
.win{max-width:640px;text-align:center;position:relative;overflow:hidden}
.party{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0}
.party>div{width:min(26vw,120px)}
.party>div:nth-child(1) .wig{animation:dance 1s ease-in-out infinite}
.party>div:nth-child(2) .wig{animation:dance 1s ease-in-out .33s infinite}
.party>div:nth-child(3) .wig{animation:dance 1s ease-in-out .66s infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-16px) rotate(5deg)}}
.stars{font-size:46px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.3}
.res{text-align:left;margin:12px 0;display:grid;gap:8px}
.res .r{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px}
.res .r b{flex:1;font-size:17px}
.res .r .pts{font-weight:700;white-space:nowrap}
.res .r button{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:8px 12px;cursor:pointer;min-height:40px}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.btn.reward{background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-color:#f2a922;color:#4a2a00;box-shadow:0 4px 0 #c9800f;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}10%{transform:rotate(-2deg) scale(1.03)}20%{transform:rotate(2deg) scale(1.03)}30%{transform:rotate(0)}}
.hint2{font-size:15px;opacity:.75;text-align:center;margin:10px 0 0}

/* ---------- Belohnung: Snack-Regen ---------- */
#snack{flex:1;display:flex;flex-direction:column;max-width:860px;width:100%;margin:0 auto}
.sbox{position:relative;flex:1;min-height:360px;border-radius:24px;overflow:hidden;border:3px solid #fff;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(#bfe6ff,#e8f6ff 70%,#9fdc8a 70%,#6cc35a);box-shadow:0 8px 26px rgba(40,30,90,.25);cursor:pointer}
#scv{position:absolute;inset:0;width:100%;height:100%;display:block}
#smon{position:absolute;bottom:6px;left:0;width:clamp(90px,22vw,120px);pointer-events:none;will-change:transform}
#smon .bub{font-size:14px}
.shud{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:10px;pointer-events:none}
.shud .tbar{flex:1;height:14px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;border:2px solid #fff}
.shud .tbar div{height:100%;width:100%;background:linear-gradient(90deg,#2fa84f,#ffd23f);border-radius:999px}
.shud b{background:#fff;border-radius:999px;padding:4px 12px;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;
  background:rgba(255,255,255,.55)}
.sover .big{font-size:clamp(60px,16vw,110px);font-weight:700;color:var(--accent);text-shadow:0 4px 0 #fff;animation:pop2 .5s}
@keyframes pop2{from{transform:scale(.3);opacity:0}}
.sover h2{margin:0;font-size:clamp(22px,4vw,30px)}
.sover p{margin:0;font-weight:700}
.picks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.picks button{width:110px;padding:8px;font:inherit;font-weight:700;font-size:17px;color:inherit;background:#fff;border:3px solid var(--line);border-radius:18px;cursor:pointer}
.legend{font-size:16px;font-weight:700;background:#fff;border-radius:14px;padding:6px 12px}

@media (max-width:560px){
  .card{padding:14px}.play{padding:12px 10px}
  #stage{min-height:100px;padding-top:30px}
  .areas{grid-template-columns:1fr 1fr;gap:8px}
  .area{padding:8px 6px}.area .pic{width:84px;height:84px}.area .pic .one{width:80px}.area .pic .three>span{width:34px}
  .area b{font-size:18px}.area small{font-size:13px}
  .lbl{min-width:0;display:block;width:max-content;margin:6px auto 0}
  .line{text-align:center}
  .co{font-size:19px;padding:8px 12px;min-width:60px}
  .s0{min-height:80px}.s1{min-height:110px}.s2{min-height:140px}
  .step small{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <a class="pill" href="../../#/" target="_top">🏠 Alle Spiele</a>
  <span class="pill" id="progress"></span>
  <button class="pill" id="mute" type="button" aria-label="Ton an oder aus">🔊</button>
</div>
<main>
  <section class="card start" id="start">
    <h1><span>👾</span> Die Wortmonster</h1>
    <p class="intro">Die Monster haben Hunger! Aber jedes Monster frisst nur <b>eine</b> Wortart.
      Füttere sie mit den richtigen Wörtern – dann werden sie groß und satt.</p>
    <div class="areas">
      <button class="area" data-area="nomen" type="button"><span class="pic"><span class="one" data-pic="n"></span></span>
        <b>Nomi</b><small>frisst Nomen<br>Artikel · Einzahl · Nomen finden</small><span class="st" data-st="nomen"></span></button>
      <button class="area" data-area="verben" type="button"><span class="pic"><span class="one" data-pic="v"></span></span>
        <b>Flitz</b><small>frisst Verben<br>Grundform · Personalform</small><span class="st" data-st="verben"></span></button>
      <button class="area" data-area="adjektive" type="button"><span class="pic"><span class="one" data-pic="a"></span></span>
        <b>Ada</b><small>frisst Adjektive<br>Vergleichsstufen</small><span class="st" data-st="adjektive"></span></button>
      <button class="area" data-area="mix" type="button"><span class="pic"><span class="three"><span data-pic="n"></span><span data-pic="v"></span><span data-pic="a"></span></span></span>
        <b>Monster-Buffet</b><small>alle Wortarten<br>Wörterschlange · Wortgruppen</small><span class="st" data-st="mix"></span></button>
    </div>
    <button class="btn main testbtn" data-area="test" type="button">📝 Probetest – wie im echten Test<small id="testBest">15 Aufgaben, jeweils ein Versuch</small></button>
    <div class="row">
      <a class="btn" href="../../#/" target="_top">🏠 Alle Spiele</a>
      <button class="btn" id="muteStart" type="button">🔊 Ton an</button>
    </div>
  </section>

  <section id="game" hidden>
    <div id="stage"></div>
    <div class="belly" title="Bauch"><div id="bellyFill"></div></div>
    <div class="card play">
      <div class="kicker" id="kicker"></div>
      <h2 id="prompt"></h2>
      <div id="task"></div>
      <div id="opts"></div>
      <p id="fb" aria-live="polite"></p>
      <button class="btn main" id="nextBtn" type="button" hidden>Weiter ➜</button>
    </div>
  </section>

  <section id="snack" hidden>
    <div class="sbox" id="sbox">
      <canvas id="scv"></canvas>
      <div id="smon"></div>
      <div class="shud"><div class="tbar"><div id="stime"></div></div><b id="sscore">0</b></div>
      <div class="sover" id="sover"></div>
    </div>
  </section>

  <section class="card win" id="win" hidden>
    <div class="party" id="party"></div>
    <div id="winBox"></div>
    <button class="btn reward" id="rewardBtn" type="button" hidden>🍭 Belohnung: Snack-Regen</button>
    <p class="hint2" id="rewardHint" hidden>Löse eine neue Runde – dann gibt es wieder Snack-Regen! 🍭</p>
    <button class="btn main" id="againBtn" type="button">🔄 Nochmal spielen</button>
    <div class="row">
      <button class="btn" id="menuBtn" type="button">👾 Andere Monster</button>
      <a class="btn" href="../../#/" target="_top">🏠 Alle Spiele</a>
    </div>

    var r = state.reward; state.reward = null;
    [].forEach.call(document.querySelectorAll('.confetti'), function (c) { c.remove(); });
    SN = { secs: r.secs, m: null, score: 0, caught: 0, items: [], pops: [], el: 0, spawn: 0, x: 0, tx: 0, key: 0, run: false, raf: 0, last: 0 };
    $('smon').innerHTML = ''; $('sscore').textContent = '0'; $('stime').style.width = '100%';
    show('snack');
    $('progress').textContent = '🍭 Snack-Regen';
    sizeSnack();
    if (r.mons.length === 1) pickSnack(r.mons[0]);
    else {
      $('sover').hidden = false;
      $('sover').innerHTML = '<h2>Wen willst du füttern?</h2><div class="picks">' + r.mons.map(function (m) {
        return '<button type="button" data-pick="' + m + '">' + svgMon(m) + MON[m].name + '</button>';
      }).join('') + '</div>';
      [].forEach.call(document.querySelectorAll('[data-pick]'), function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); pickSnack(b.getAttribute('data-pick')); }); });
    }
  }
  function pickSnack(m) {
    SN.m = m;
    $('smon').innerHTML = '<div class="mon" data-m="' + m + '"><div class="grow">' + svgMon(m) + '</div></div>';
    var W = $('sbox').clientWidth; SN.x = SN.tx = W / 2; placeMon();
    $('sover').hidden = false;
    var n = 3;
    var tick = function () {
      if (!SN || state.screen !== 'snack') return;
      if (n > 0) {
        $('sover').innerHTML = '<div class="big">' + n + '</div><p class="legend">🍎 🍪 🍬 = 1 · ⭐ = 5 · 🧦 Socke = −3</p><p>Fang die Snacks!</p>';
        tone(440, 0.12, 'triangle'); n--; SN.cd = setTimeout(tick, 700);
      } else {
        $('sover').innerHTML = '<div class="big">Los!</div>'; tone(880, 0.2, 'triangle');
        SN.cd = setTimeout(function () { $('sover').hidden = true; }, 450);
        SN.run = true; SN.last = 0; SN.raf = requestAnimationFrame(loopSnack);
      }
    };
    tick();
  }
  function sizeSnack() {
    var c = $('scv'), b = $('sbox'), d = window.devicePixelRatio || 1;
    c.width = Math.round(b.clientWidth * d); c.height = Math.round(b.clientHeight * d);
    c.getContext('2d').setTransform(d, 0, 0, d, 0, 0);
  }
  function placeMon() {
    var w = $('smon').offsetWidth, W = $('sbox').clientWidth;
    SN.x = Math.max(w / 2, Math.min(W - w / 2, SN.x));
    $('smon').style.transform = 'translateX(' + (SN.x - w / 2) + 'px) scale(' + (1 + Math.min(SN.caught, 30) * 0.008) + ')';
  }
  function spawnSnack(kind, x) {
    var W = $('sbox').clientWidth, r = Math.random();
    kind = kind || (r < 0.07 ? 'star' : r < 0.25 ? 'sock' : 'snack');
    var size = Math.max(34, Math.min(52, W * 0.075));
    SN.items.push({ k: kind, e: kind === 'star' ? '⭐' : kind === 'sock' ? '🧦' : pick(SNACKS), x: x != null ? x : size / 2 + Math.random() * (W - size), y: -size,
      v: ($('sbox').clientHeight * (0.32 + SN.el * 0.018)) * (0.85 + Math.random() * 0.3), s: size, rot: (Math.random() - 0.5) * 2 });
  }
  function loopSnack(ts) {
    if (!SN || !SN.run) return;
    if (document.hidden) { SN.last = 0; SN.raf = requestAnimationFrame(loopSnack); return; }
    var dt = SN.last ? Math.min(0.05, (ts - SN.last) / 1000) : 0; SN.last = ts;
    var box = $('sbox'), W = box.clientWidth, H = box.clientHeight, ctx = $('scv').getContext('2d');
    SN.el += dt;
    var left = Math.max(0, SN.secs - SN.el);
    $('stime').style.width = (100 * left / SN.secs) + '%';
    /* neue Snacks, mit der Zeit immer mehr */
    SN.spawn -= dt;
    if (SN.spawn <= 0) { spawnSnack(); SN.spawn = Math.max(0.33, 0.85 - SN.el * 0.03); }
    /* Monster bewegen: zum Finger hin oder mit Pfeiltasten */
    if (SN.key) SN.tx = SN.x + SN.key * 40;
    var dx = SN.tx - SN.x, step = 900 * dt;
    SN.x += Math.abs(dx) < step ? dx : step * Math.sign(dx);
    placeMon();
    var mw = $('smon').offsetWidth, mtop = H - 6 - mw * (1 + Math.min(SN.caught, 30) * 0.008);
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    SN.items = SN.items.filter(function (it) {
      it.y += it.v * dt;
      if (it.y > mtop + mw * 0.25 && it.y < mtop + mw * 0.8 && Math.abs(it.x - SN.x) < mw * 0.45) { catchSnack(it); return false; }
      if (it.y > H + it.s) return false;
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(SN.el * 3 + it.rot) * 0.25);
      ctx.font = it.s + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(it.e, 0, 0); ctx.restore();
      return true;
    });
    /* kleine Punkte-Anzeigen */
    ctx.font = 'bold 26px "Trebuchet MS",sans-serif';
    SN.pops = SN.pops.filter(function (p) {
      p.t += dt; if (p.t > 0.8) return false;
      ctx.globalAlpha = 1 - p.t / 0.8; ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y - p.t * 60); ctx.globalAlpha = 1;
      return true;
    });
    if (left <= 0) { finishSnack(); return; }
    SN.raf = requestAnimationFrame(loopSnack);
  }
  function catchSnack(it) {
    var pts = it.k === 'star' ? 5 : it.k === 'sock' ? -3 : 1;
    SN.score = Math.max(0, SN.score + pts);
    if (pts > 0) { SN.caught++; eat(SN.m, it.k === 'star' ? 'Wow! +5 ⭐' : (Math.random() < 0.3 ? pick(YUM) : false)); }
    else yuck(SN.m, 'Bäh! Socke! 🧦');
    SN.pops.push({ s: (pts > 0 ? '+' : '') + pts, x: it.x, y: it.y, t: 0, c: pts > 0 ? '#1d7a3a' : '#c0392b' });
    $('sscore').textContent = SN.score;
  }
  function stopSnack() { if (SN) { SN.run = false; cancelAnimationFrame(SN.raf); clearTimeout(SN.cd); } }
  function finishSnack() {
    if (!SN) return;
    stopSnack();
    var rec = SN.score > store.snack;
    if (rec) { store.snack = SN.score; save(); }
    var m = SN.m || 'n';
    $('winBox').innerHTML = '<h1>Mjam! 😋</h1><p><b>' + MON[m].name + ' hat ' + SN.score + ' Punkte erschnappt!</b></p>' +
      '<p>' + (rec ? '🏆 Neuer Rekord!' : 'Rekord: ' + store.snack + ' Punkte') + '</p>';
    $('party').innerHTML = '<div>' + svgMon(m) + '</div>';
    $('rewardBtn').hidden = true; $('rewardHint').hidden = false;
    $('againBtn').textContent = '🔄 Nochmal üben';
    SN = null;
    show('win');
    confetti(); SND.win();
  }
  (function () {
    var box = $('sbox');
    function aim(e) { if (SN && SN.m) { var r = box.getBoundingClientRect(); SN.tx = e.clientX - r.left; SN.key = 0; } }
    box.addEventListener('pointerdown', function (e) { aim(e); try { box.setPointerCapture(e.pointerId); } catch (x) {} });
    box.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || e.buttons) aim(e); });
    document.addEventListener('keydown', function (e) { if (SN && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { SN.key = e.key === 'ArrowLeft' ? -1 : 1; e.preventDefault(); } });
    document.addEventListener('keyup', function (e) { if (SN && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) SN.key = 0; });
    window.addEventListener('resize', function () { if (state.screen === 'snack') sizeSnack(); });
  })();

  /* ---------- Bedienung ---------- */
  [].forEach.call(document.querySelectorAll('[data-area]'), function (b) { b.addEventListener('click', function () { startArea(b.getAttribute('data-area')); }); });
  $('nextBtn').addEventListener('click', next);
  $('againBtn').addEventListener('click', function () { startArea(state.area); });
  $('menuBtn').addEventListener('click', renderStart);
  $('rewardBtn').addEventListener('click', startSnack);
  $('mute').addEventListener('click', toggleMute);
  $('muteStart').addEventListener('click', toggleMute);
  document.addEventListener('keydown', function (e) {
    if (state.screen !== 'game' || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = parseInt(e.key, 10);
    if (!k) return;
    var q = cur();
    if (q.type === 'gaps' && !state.done) { var b = document.querySelectorAll('#opts .co')[k - 1]; if (b) b.click(); }
    else if (state.phase === 'sort' && state.sel != null && q.mons[k - 1]) feed(state.sel, q.mons[k - 1]);
  });

  load();
  renderStart();

  /* Zugang für den Durchspiel-Test (tools/spieltests/deutsch-wortmonster.js), nur mit ?test in der Adresse */
  if (/[?&]test\b/.test(location.search)) {
    window.WORTMONSTER = {
      GEN: GEN, ROUNDS: ROUNDS, build: buildRound, parse: parseSentence, SAETZE: SAETZE, VERBEN: VERBEN, ADJ: ADJ, NOMEN: NOMEN, SCHLANGE: SCHLANGE,
      state: function () { return state.screen; },
      task: function () { return cur(); },
      results: function () { return state.results; },
      snack: function () { return SN ? { run: SN.run, score: SN.score, secs: SN.secs, m: SN.m, x: SN.x } : null; },
      snackDrop: function (kind) { if (SN) spawnSnack(kind, SN.x); },
      snackCalm: function () { if (SN) { SN.items = []; SN.spawn = 999; } },
      snackFinish: function () { finishSnack(); },
      /* was gerade richtig wäre */
      solution: function () {
        var q = cur();
        if (state.done) return { type: 'done' };
        if (q.type === 'gaps') {
          var opts = stepOpts(q).slice(), step = q.steps[state.step];
          return { type: 'gaps', ok: step.ok.filter(function (o) { return opts.indexOf(o) >= 0; }), opts: opts };
        }
        if (q.type === 'tap') {
          var t = [], o = [];
          [].forEach.call(document.querySelectorAll('#task .tw'), function (b) { var i = +b.getAttribute('data-i'); if (q.toks[i].m === q.tm) { if (!b.classList.contains('hit')) t.push(i); } else o.push(i); });
          return { type: 'tap', targets: t, others: o };
        }
        if (state.phase === 'cut') {
          var s = state.snake;
          return { type: 'cut', starts: Object.keys(s.starts).map(Number).filter(function (k) { return !s.cut[k]; }),
            others: s.letters.split('').map(function (_, i) { return i; }).filter(function (i) { return !s.starts[i]; }) };
        }
        if (state.phase === 'sort' && document.querySelector('#task .chip')) return { type: 'sort', chips: state.left.map(function (i) { return { i: i, m: q.words[i].m }; }) };
        return { type: 'wait' };
      }
    };
  }
})();
</script>
