function polyPath(ctx,poly,w,h){
  var n=poly.length/2,pts=[],i;
  for(i=0;i<n;i++){pts.push([(poly[2*i]-LON0)/(LON1-LON0)*w,(LAT1-poly[2*i+1])/(LAT1-LAT0)*h]);}
  ctx.beginPath();
  var m0=[(pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2];
  ctx.moveTo(m0[0],m0[1]);
  for(i=0;i<n;i++){var a=pts[i],b=pts[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
  ctx.closePath();
}
function drawLand(ctx,w,h,seaCol,landCol){
  ctx.fillStyle=seaCol;ctx.fillRect(0,0,w,h);
  ctx.fillStyle=landCol;
  LANDS.forEach(function(p){polyPath(ctx,p,w,h);ctx.fill();});
  ctx.fillStyle=seaCol;polyPath(ctx,BLACKSEA,w,h);ctx.fill();
}

var ac=null;
function tone(seq){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime;
    seq.forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.12);g.gain.exponentialRampToValueAtTime(0.18,t+i*0.12+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.12+0.22);
      o.connect(g);g.connect(ac.destination);o.start(t+i*0.12);o.stop(t+i*0.12+0.25);
    });
  }catch(e){}
}

function fmtPop(n){
  var m=Math.pow(10,Math.floor(Math.log(n)/Math.LN10)-1);
  n=Math.round(n/m)*m;
  if(n>=1e6){
    var v=n/1e6,s=v>=100?String(Math.round(v)):v.toFixed(1).replace('.',',');
    if(s.slice(-2)===',0')s=s.slice(0,-2);
    return 'ca. '+s+' Millionen';
  }
  if(n>=1000)return 'ca. '+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return 'ca. '+n;
}
function popOpts(c){
  var correct=fmtPop(c.pop),seen={},items=[{v:c.pop,s:correct}];
  seen[correct]=1;
  var mult=shuffle([0.15,0.25,0.4,0.6,1.7,2.5,4,7]);
  for(var i=0;i<mult.length&&items.length<4;i++){
    var v=c.pop*mult[i];
    if(v>200e6)continue;
    var s=fmtPop(v);
    if(!seen[s]){seen[s]=1;items.push({v:v,s:s});}
  }
  items.sort(function(a,b){return a.v-b.v;});
  return {ans:correct,opts:items.map(function(x){return x.s;})};
}
function buildQs(c){
  var others=C.filter(function(x){return x!==c;});
  var qs=[];
  qs.push({type:'flag',t:'Welche Flagge gehört zu '+c.dat+'?',ans:c.id,flags:shuffle(shuffle(others).slice(0,3).concat([c]))});
  var caps=shuffle(others.filter(function(x){return x.cap!==c.cap;})).slice(0,3).map(function(x){return x.cap;});
  qs.push({t:'Wie heißt die Hauptstadt von '+c.dat+'?',ans:c.cap,opts:shuffle(caps.concat([c.cap]))});
  var lms=shuffle(others).slice(0,3).map(function(x){return x.lm;});
  qs.push({t:'Welche Sehenswürdigkeit gibt es in '+c.cap+'?',ans:c.lm,opts:shuffle(lms.concat([c.lm]))});
  var po=popOpts(c);
  qs.push({t:'Wie viele Menschen leben ungefähr in '+c.dat+'?',ans:po.ans,opts:po.opts});

}

function openQuiz(c,qs){
  var qi=0,mistakes=0,gained=0,first=!visited[c.id];
  var ov=$('ov');ov.classList.remove('hidden');
  function next(){qi++;if(qi<qs.length)showQ();else finish();}
  function showQ(){
    var q=qs[qi];
    if(q.type==='flag'){
      ov.innerHTML='<div class="card"><h2>🏳️ Flaggen werden geladen …</h2></div>';
      loadFlags(q.flags,function(ok){if(!ok){next();return;}renderQ(q);});
    }else renderQ(q);
  }
  function renderQ(q){
    var tries=0,done=false;
    ov.innerHTML='';
    var card=document.createElement('div');card.className='card';
    var sm=document.createElement('div');sm.className='small';sm.textContent='🛬 Gelandet in '+c.dat+'!  ·  Aufgabe '+(qi+1)+' von '+qs.length;
    var h=document.createElement('h2');h.textContent=q.t;
    var wrap=document.createElement('div');
    var fb=document.createElement('div');fb.className='fb';
    card.appendChild(sm);card.appendChild(h);card.appendChild(wrap);card.appendChild(fb);ov.appendChild(card);
    function answer(b,ok){
      if(done||b.disabled)return;
      if(ok){
        done=true;b.classList.add('good');
        var pts=tries===0?10:(tries===1?5:(tries===2?2:0));
        if(first)gained+=pts;
        mistakes+=tries;
        fb.textContent=tries===0?'✅ Richtig! Super!':'✅ Richtig!';
        tone([660,880]);
        setTimeout(next,1100);
      }else{
        tries++;b.classList.add('bad');b.disabled=true;
        fb.textContent='Fast! Probier es nochmal 🙂';tone([220]);
      }
    }
    if(q.type==='flag'){
      wrap.className='flags';
      q.flags.forEach(function(f){
        var b=document.createElement('button');b.className='opt flagopt';
        var im=document.createElement('img');im.src=flagURL(f);im.alt='Flagge';
        b.appendChild(im);
        b.addEventListener('click',function(){answer(b,f.id===q.ans);});
        wrap.appendChild(b);
      });
    }else{
      q.opts.forEach(function(o){
        var b=document.createElement('button');b.className='opt';b.textContent=o;
        b.addEventListener('click',function(){answer(b,o===q.ans);});
        wrap.appendChild(b);
      });
    }
  }
  function finish(){
    var stars=mistakes===0?3:(mistakes<=3?2:1);
    if(first){visited[c.id]=stars;score+=gained;save();melde();}
    else if(stars>(visited[c.id]||0)){visited[c.id]=stars;save();}
    updateScore();refreshPins();
    tone([523,659,784,1047]);
    ov.innerHTML='';
    var card=document.createElement('div');card.className='card';
    var all=visitedCount()>=NC;
    card.innerHTML='<div class="stars">'+'⭐'.repeat(stars)+'<span style="opacity:.25">'+'⭐'.repeat(3-stars)+'</span></div>'+
      '<h2>Geschafft: '+c.name+'!</h2>'+
      '<p>🏙️ Die Hauptstadt von '+c.dat+' ist <b>'+c.cap+'</b>.</p>'+
      '<p>📍 Dort gibt es: <b>'+c.lm+'</b></p>'+
      '<p class="small">'+(first?('+'+gained+' Punkte'):'Geübt – Punkte gibt es nur beim ersten Mal')+'</p>';
    var b=document.createElement('button');b.className='btn';b.textContent=all?'🏆 Zum Ziel!':'Weiterfliegen ✈️';
    b.addEventListener('click',function(){
      ov.classList.add('hidden');
      if(all){showWin();return;}
      if((target&&target.id===c.id)||!target)chooseTarget(false);
      refreshPins();
      state='fly';
    });
    card.appendChild(b);ov.appendChild(card);
    if(all){target=null;}
  }
  showQ();
}
function showWin(){
  state='win';
  var ov=$('ov');ov.classList.remove('hidden');
  ov.innerHTML='<div class="card"><div style="font-size:70px">🏆</div><h1>Du bist Europa-Meister!</h1><p>Du hast alle '+NC+' Länder besucht und ihre Hauptstädte gelernt.</p><p class="stars">⭐ '+score+'</p></div>';
  var card=ov.firstChild;
  var b=document.createElement('button');b.className='btn';b.textContent='Nochmal spielen';
  b.addEventListener('click',function(){visited={};score=0;save();updateScore();ov.classList.add('hidden');chooseTarget(false);refreshPins();state='fly';});
  card.appendChild(b);
  var home=document.createElement('a');home.className='btn alt';home.href='../../#/';home.target='_top';home.textContent='🏠 Alle Spiele';home.style.textDecoration='none';card.appendChild(home);
  tone([523,659,784,1047,1319]);
}

/* Game-Test: Zugang für den Durchspiel-Test (tools/flugtest.js), nur mit ?test in der Adresse */
if(/[?&]test\b/.test(location.search))window.FLUGTEST={C:C,
  state:function(){return state;},score:function(){return score;},
  letztesZiel:function(){visited={};score=0;C.slice(0,-1).forEach(function(c){visited[c.id]=3;});return C[C.length-1];},
  landen:function(c){state='landing';lockId=c.id;var qs=buildQs(c);window.FLUGTEST.qs=qs;openQuiz(c,qs);}};

/* ---------- Start-Bildschirm ---------- */
function showStart(){
  var ov=$('ov');ov.classList.remove('hidden');
  var has=visitedCount()>0&&visitedCount()<NC;
  ov.innerHTML='<div class="card"><div style="font-size:60px">✈️🌍</div><h1>Flug über Europa</h1>'+
   '<p>Flieg mit dem Flugzeug über Europa! Folge dem <b>orangen Pfeil</b> zum Ziel-Land, lande bei der <b>roten Kugel</b> (Hauptstadt) und beantworte die Fragen.</p>'+
   '<p class="small">📱 Handy: ◀ ▶ gedrückt halten, 🚀 = schneller<br>💻 Computer: Pfeiltasten oder A/D · W = schneller · Leertaste = landen</p></div>';
  var card=ov.firstChild;
  function go(reset){
    if(reset){visited={};score=0;save();}
    ov.classList.add('hidden');
    ['mission','score','mini','bM','bN','bH','bL','bR','bB'].forEach(function(id){$(id).classList.remove('hidden');});
    updateScore();chooseTarget(false);refreshPins();state='fly';
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume();}catch(e){}
  }
  var b=document.createElement('button');b.className='btn';b.textContent=has?'Weiterspielen ('+visitedCount()+'/'+NC+')':'Los geht\u2019s!';
  b.addEventListener('click',function(){go(false);});
  card.appendChild(b);
  var home=document.createElement('a');home.className='btn alt';home.href='../../#/';home.target='_top';home.textContent='🏠 Alle Spiele';home.style.textDecoration='none';card.appendChild(home);
  if(has){var b2=document.createElement('button');b2.className='btn alt';b2.textContent='Neu starten';b2.addEventListener('click',function(){go(true);});card.appendChild(b2);}
}

/* ---------- Hauptschleife ---------- */
var camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),dp=new THREE.Vector3(),dl=new THREE.Vector3();
var BX0=wx(-23.2),BX1=wx(38.6),BZ0=wz(71.2),BZ1=wz(34.8);
var R_LAND=2.7;
var arrow=$('arrow'),miniCtx=$('mini').getContext('2d'),lastClampToast=0;

function update(dt,t){
  uniforms.uTime.value=t;
  var flying=(state==='fly'||state==='menu');
  var tgtTurn=0;
  if(state==='menu'){tgtTurn=0.28;}
  else if(state==='fly'){tgtTurn=(input.right?1:0)-(input.left?1:0);}
  if(flying){
    P.turn+=(tgtTurn-P.turn)*Math.min(1,dt*6);
    P.yaw+=P.turn*1.3*dt;
    var sp=6.4*(input.boost?1.8:(input.slow?0.55:1));
    P.x+=Math.sin(P.yaw)*sp*dt;P.z-=Math.cos(P.yaw)*sp*dt;
    P.y+=(3.2-P.y)*Math.min(1,dt*1.6);
    var cx=Math.min(BX1,Math.max(BX0,P.x)),cz=Math.min(BZ1,Math.max(BZ0,P.z));
    if((cx!==P.x||cz!==P.z)&&state==='fly'&&t-lastClampToast>2.5){toast('Hier endet die Karte – dreh um! 🔄');lastClampToast=t;}
    P.x=cx;P.z=cz;
  }else if(state==='landing'||state==='quiz'||state==='win'){
    P.turn+=(0-P.turn)*Math.min(1,dt*4);
    if(curPin){var k=Math.min(1,dt*2.4);P.x+=(curPin.x-P.x)*k;P.z+=(curPin.z-P.z)*k;}
    P.y+=(0.55-P.y)*Math.min(1,dt*2.2);
  }
  var pitch=Math.max(-0.35,Math.min(0.3,(3.2-P.y)*0.12*(flying?1:-1)));
  if(!flying)pitch=Math.max(-0.3,Math.min(0.2,(P.y-0.55)*-0.08));
  plane.position.set(P.x,P.y,P.z);
  plane.rotation.set(pitch,-P.yaw,-P.turn*0.6);
  prop.rotation.z+=dt*45;
  shadow.position.set(P.x,0.05,P.z);shadow.rotation.z=-P.yaw;
  var ss=Math.max(0.5,1.3-P.y*0.12);shadow.scale.set(ss*1.7,ss,1);

  /* Nähe zu Hauptstadt */
  if(state==='fly'){
    var best=null,bd=1e9;
    for(var i=0;i<NC;i++){var p=C[i].pin,dx=p.x-P.x,dz=p.z-P.z,d=dx*dx+dz*dz;
      if(d<bd){bd=d;best=C[i];}}
    if(lockId){var lp=C.filter(function(c){return c.id===lockId;})[0];if(lp){var ddx=lp.pin.x-P.x,ddz=lp.pin.z-P.z;if(ddx*ddx+ddz*ddz>(R_LAND+1.2)*(R_LAND+1.2))lockId=null;}}
    if(best&&bd<R_LAND*R_LAND&&best.id!==lockId){
      if(nearC!==best){nearC=best;$('land').textContent='🛬 In '+best.dat+' landen';$('land').classList.remove('hidden');}
    }else if(nearC){nearC=null;$('land').classList.add('hidden');}
  }

  /* Kamera */
  if(state==='landing'||state==='quiz'||state==='win'){
    var cp=curPin||{x:P.x,z:P.z};
    dp.set(cp.x+3.2,1.9,cp.z+4.4);dl.set(cp.x,0.8,cp.z);
  }else{
    var fx=Math.sin(P.yaw),fz=-Math.cos(P.yaw);
    dp.set(P.x-fx*6.8,P.y+2.7,P.z-fz*6.8);dl.set(P.x+fx*9,P.y-1.0,P.z+fz*9);
  }
  var kk=1-Math.exp(-dt*(flying?7:2.2));
  camPos.lerp(dp,kk);camLook.lerp(dl,kk);
  camera.position.copy(camPos);camera.lookAt(camLook);

  /* Pins, Strahl, Beschriftungen, Wolken */
  var pulse=1+0.18*Math.sin(t*5);
  for(var j=0;j<NC;j++){
    var c=C[j];
    c.pin.ball.scale.setScalar(c===target?pulse*1.25:1);
    c.pin.ring.scale.setScalar(c===target?1+0.25*Math.sin(t*4):1);
    var ddx2=c.label.position.x-P.x,ddz2=c.label.position.z-P.z;
    var dd=Math.sqrt(ddx2*ddx2+ddz2*ddz2);
    c.label.material.opacity=Math.max(0,Math.min(1,1.25-dd/17));
    c.label.visible=c.label.material.opacity>0.02;
  }
  if(window.__beam&&target){var bdx=target.pin.x-camera.position.x,bdz=target.pin.z-camera.position.z,bdd=Math.sqrt(bdx*bdx+bdz*bdz);window.__beam.material.opacity=(0.3+0.12*Math.sin(t*4))*Math.min(1,Math.max(0,(bdd-3)/4));}
  window.__clouds.forEach(function(cl){cl.position.x+=cl.userData.v*dt;if(cl.position.x>MW/2+5)cl.position.x=-MW/2-5;});

  /* HUD */
  if(target&&(state==='fly'||state==='menu')){
    var tx=target.pin.x-P.x,tz=target.pin.z-P.z;
    var bearing=Math.atan2(tx,-tz);
    arrow.style.transform='rotate('+((bearing-P.yaw)*180/Math.PI).toFixed(1)+'deg)';
    $('tgtDist').textContent='ca. '+(Math.round(Math.hypot(tx,tz)*55/10)*10)+' km';
  }
  drawMini(t);
}
function drawMini(t){
  if(!window.__mini||$('mini').classList.contains('hidden'))return;
  var cv=$('mini'),w=cv.width,h=cv.height;
  miniCtx.drawImage(window.__mini,0,0,w,h);
  function m(x,z){return [(x+MW/2)/MW*w,(z+MH/2)/MH*h];}
  C.forEach(function(c){
    var p=m(c.pin.x,c.pin.z);
    miniCtx.beginPath();miniCtx.arc(p[0],p[1],visited[c.id]?5:3.5,0,6.283);
    miniCtx.fillStyle=visited[c.id]?'#1fae55':'#ffffff';miniCtx.fill();
    miniCtx.lineWidth=1.5;miniCtx.strokeStyle='#16324f';miniCtx.stroke();
  });
  if(target){
    var q=m(target.pin.x,target.pin.z),r=7+4*Math.abs(Math.sin(t*4));
    miniCtx.beginPath();miniCtx.arc(q[0],q[1],r,0,6.283);miniCtx.lineWidth=3;miniCtx.strokeStyle='#ff9f1c';miniCtx.stroke();
  }
  var pp=m(P.x,P.z);
  miniCtx.save();miniCtx.translate(pp[0],pp[1]);miniCtx.rotate(P.yaw);
  miniCtx.beginPath();miniCtx.moveTo(0,-11);miniCtx.lineTo(8,9);miniCtx.lineTo(0,5);miniCtx.lineTo(-8,9);miniCtx.closePath();
  miniCtx.fillStyle='#e53935';miniCtx.fill();miniCtx.lineWidth=2;miniCtx.strokeStyle='#fff';miniCtx.stroke();miniCtx.restore();
}

function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),0.05);
  update(dt,clock.elapsedTime);
  renderer.render(scene,camera);
}

/* ---------- Start ---------- */
load();
setTimeout(function(){
  try{
    buildMap();buildWorld();
  }catch(e){
    $('loading').textContent='Leider ist beim Laden ein Fehler passiert: '+e.message;
    return;
  }
  /* Kamera sofort hinter das Flugzeug setzen */
  var fx=Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  camPos.set(P.x-fx*6.8,P.y+2.7,P.z-fz*6.8);camLook.set(P.x+fx*9,P.y-1.0,P.z+fz*9);
  state='menu';
  updateScore();
  $('loading').classList.add('hidden');
  showStart();
  frame();
},60);
})();
</script>
