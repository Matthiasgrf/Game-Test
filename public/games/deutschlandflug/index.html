<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/zoom-schutz.js"></script>
<script src="../shared/game-test.js"></script>
<link rel="stylesheet" href="../shared/kit/theme.css">
<title>Flug über Deutschland – Bundesländer und Hauptstädte</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(#69b9ee 0%,#d6ecfb 22%,#d6ecfb 100%);touch-action:none;color:#16324f}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
.hidden{display:none!important}
#mission{top:max(10px,env(safe-area-inset-top));left:10px;background:rgba(255,255,255,.93);border-radius:18px;padding:8px 14px 8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:calc(100vw - var(--gt-bar-space) - 20px)}
#arrow{width:46px;height:46px;flex:none;transition:transform .08s linear}
#mission .lbl{font-size:12px;opacity:.7;line-height:1}
#mission .tgt{font-size:20px;font-weight:800;line-height:1.15}
#mission .dst{font-size:12px;opacity:.7}
#score{top:calc(max(10px,env(safe-area-inset-top)) + 70px);left:10px;background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#mini{top:calc(max(10px,env(safe-area-inset-top)) + 58px);right:10px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);border:3px solid #fff;background:#3b9fd8;width:140px;height:auto}
.btnrow{position:fixed;z-index:6;bottom:calc(20px + env(safe-area-inset-bottom))}
.ctl{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.55);border:4px solid rgba(255,255,255,.95);font-size:42px;color:#16324f;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.25);font-weight:900}
.ctl.on{background:rgba(255,200,60,.9)}
#bH{left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 156px);position:fixed;z-index:6;border-radius:14px;border:3px solid #fff;background:rgba(255,255,255,.85);font-size:14px;font-weight:700;padding:6px 10px;color:#16324f;text-decoration:none}
#bL{left:16px}#bR{right:16px}
#bB{right:22px;bottom:calc(122px + env(safe-area-inset-bottom));width:70px;height:70px;font-size:30px}
#bM{top:calc(max(10px,env(safe-area-inset-top)) + 170px);right:10px;position:fixed;z-index:6;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.8);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#bN{left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 112px);position:fixed;z-index:6;border-radius:14px;border:3px solid #fff;background:rgba(255,255,255,.85);font-size:14px;font-weight:700;padding:6px 10px;cursor:pointer;color:#16324f}
#land{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom));z-index:7;background:linear-gradient(#ffb23f,#ff8a1f);color:#fff;border:4px solid #fff;border-radius:999px;font-size:22px;font-weight:900;padding:16px 26px;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;animation:pulse 1s infinite;white-space:nowrap}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
#toast{position:fixed;z-index:9;top:38%;left:50%;transform:translateX(-50%);background:rgba(20,40,70,.85);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,40,80,.45);padding:12px;touch-action:auto}
.card{background:#fff;border-radius:26px;padding:22px 20px;max-width:560px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4);text-align:center;max-height:96vh;overflow:auto}
.card h1{margin:4px 0 6px;font-size:34px}
.card h2{margin:8px 0 12px;font-size:23px;line-height:1.25}
.card p{margin:8px 0;font-size:17px;line-height:1.4}
.small{font-size:14px;opacity:.7}
.opt{display:block;width:100%;margin:9px 0;padding:14px;font-size:20px;font-weight:800;border-radius:16px;border:3px solid #cfe3f5;background:#f4f9ff;cursor:pointer;color:#16324f;font-family:inherit}
.opt:active{transform:scale(.98)}
.opt.good{background:#b9f3c8;border-color:#2fb457}
.opt.bad{background:#ffd0d0;border-color:#e45a5a;opacity:.65}
.btn{display:inline-block;margin:8px 4px 2px;padding:14px 26px;font-size:21px;font-weight:900;border-radius:999px;border:4px solid #fff;color:#fff;background:linear-gradient(#ffb23f,#ff8a1f);box-shadow:0 5px 14px rgba(0,0,0,.3);cursor:pointer;font-family:inherit;text-decoration:none}
.btn.alt{background:linear-gradient(#6fb6ee,#3b8fd8);font-size:16px;padding:10px 18px}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flagopt{display:flex;align-items:center;justify-content:center;padding:10px;margin:0;min-height:84px}
.flagopt img{max-width:100%;max-height:74px;border:1px solid #bbb;border-radius:4px;pointer-events:none}
.bigflag{max-width:150px;border:1px solid #bbb;border-radius:4px;margin:4px auto 0;display:block}
.fb{min-height:28px;font-size:18px;font-weight:800;margin-top:4px}
.stars{font-size:44px;letter-spacing:4px}
#loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;background:linear-gradient(#69b9ee,#d6ecfb);text-align:center;padding:20px}
</style>
</head>

/* mode: 'mask' (Land weiß auf schwarz), 'color' (Farbkarte), 'mini' (Minikarte) */
function drawMap(ctx,w,h,mode){
  var px=w/(LON1-LON0);
  ctx.lineJoin='round';
  if(mode==='mask'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);}
  else{ctx.fillStyle=mode==='mini'?'#3b9fd8':'#2f98d6';ctx.fillRect(0,0,w,h);}
  /* Nachbarländer */
  GEO.lands.forEach(function(r){
    ctx.beginPath();ringPath(ctx,r,w,h);
    ctx.fillStyle=mode==='mask'?'#fff':(mode==='mini'?'#c9d8b4':'#dfe3cf');ctx.fill();
    if(mode==='color'){ctx.strokeStyle='rgba(120,120,110,.55)';ctx.lineWidth=px*0.025;ctx.stroke();}
  });
  /* Bundesländer: Stadtstaaten zuletzt, damit sie oben liegen */
  var order=C.slice().sort(function(a,b){return (a.city?1:0)-(b.city?1:0);});
  order.forEach(function(c){
    shapePath(ctx,GEO.states[c.geo],w,h);
    ctx.fillStyle=mode==='mask'?'#fff':PAL[c.col];ctx.fill();
  });
  if(mode==='mask')return;
  /* Grenzen der Bundesländer */
  order.forEach(function(c){
    shapePath(ctx,GEO.states[c.geo],w,h);
    ctx.strokeStyle='rgba(255,252,235,.95)';ctx.lineWidth=mode==='mini'?1.2:px*0.05;ctx.stroke();
  });
  /* Außengrenze Deutschlands kräftiger */
  if(mode==='color'){
    C.forEach(function(c){
      shapePath(ctx,GEO.states[c.geo],w,h);
      ctx.strokeStyle='rgba(60,60,80,.35)';ctx.lineWidth=px*0.022;ctx.stroke();
    });
  }
}

/* ---------- Ton ---------- */
var ac=null;
function tone(seq){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime;
    seq.forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.12);g.gain.exponentialRampToValueAtTime(0.18,t+i*0.12+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.12+0.22);
      o.connect(g);g.connect(ac.destination);o.start(t+i*0.12);o.stop(t+i*0.12+0.25);
    });
  }catch(e){}
}

function makeLabel(text,size){
  var lines=text.split('\n');
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  var fs=64,font='bold '+fs+'px "Trebuchet MS","Segoe UI",sans-serif';ctx.font=font;
  var w=Math.ceil(Math.max.apply(null,lines.map(function(l){return ctx.measureText(l).width;})))+40,lh=fs+6,h=lh*lines.length+24;
  cv.width=w;cv.height=h;
  ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=14;ctx.strokeStyle='rgba(255,255,255,.95)';
  lines.forEach(function(l,i){ctx.strokeText(l,w/2,12+lh*(i+0.5)+3);});
  ctx.fillStyle='#16324f';
  lines.forEach(function(l,i){ctx.fillText(l,w/2,12+lh*(i+0.5)+3);});
  var tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;tex.generateMipmaps=false;
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,fog:false}));
  var hh=1.15*size*h/(fs+30);sp.scale.set(hh*w/h,hh,1);
  return sp;
}

var input={left:false,right:false,boost:false,slow:false};

function hold(el,key){
  function on(e){e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(x){}input[key]=true;el.classList.add('on');}
  function off(e){input[key]=false;el.classList.remove('on');}
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(n){el.addEventListener(n,off);});
}
hold($('bL'),'left');hold($('bR'),'right');hold($('bB'),'boost');
addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){input.left=true;e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){input.right=true;e.preventDefault();}
  else if(k==='ArrowUp'||k==='w'||k==='W'){input.boost=true;e.preventDefault();}
  else if(k==='ArrowDown'||k==='s'||k==='S'){input.slow=true;e.preventDefault();}
  else if((k===' '||k==='Enter')&&state==='fly'&&nearC){e.preventDefault();startLanding(nearC);}
});
addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')input.left=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')input.right=false;
  else if(k==='ArrowUp'||k==='w'||k==='W')input.boost=false;
  else if(k==='ArrowDown'||k==='s'||k==='S')input.slow=false;
});

/* Landesflaggen werden selbst gezeichnet – vereinfacht, kein Internet nötig */
var flagCache={};
function drawFlag(c){
  var W=300,H=180,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var x=cv.getContext('2d');
  function R(col,a,b,w,h){x.fillStyle=col;x.fillRect(a,b,w,h);}
  function HS(cols,wt){wt=wt||cols.map(function(){return 1;});var t=wt.reduce(function(a,b){return a+b;},0),y=0;cols.forEach(function(col,i){var h=H*wt[i]/t;R(col,0,y,W,h+1);y+=h;});}
  function CI(col,cx,cy,r){x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,6.2832);x.fill();}
  function EL(col,cx,cy,rx,ry,rot){x.fillStyle=col;x.beginPath();x.ellipse(cx,cy,rx,ry,rot||0,0,6.2832);x.fill();}
  function PG(col,pts){x.fillStyle=col;x.beginPath();x.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)x.lineTo(pts[i],pts[i+1]);x.closePath();x.fill();}
  function LN(col,wd,pts){x.strokeStyle=col;x.lineWidth=wd;x.lineCap='round';x.beginPath();x.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)x.lineTo(pts[i],pts[i+1]);x.stroke();}
  /* Wappenschild: Pfad setzen */
  function shieldPath(cx,cy,w,h){x.beginPath();x.moveTo(cx-w/2,cy-h/2);x.lineTo(cx+w/2,cy-h/2);x.lineTo(cx+w/2,cy+h*0.1);x.quadraticCurveTo(cx+w/2,cy+h/2,cx,cy+h/2);x.quadraticCurveTo(cx-w/2,cy+h/2,cx-w/2,cy+h*0.1);x.closePath();}
  function shield(col,cx,cy,w,h,inner){
    x.save();shieldPath(cx,cy,w,h);x.fillStyle=col;x.fill();x.clip();
    if(inner)inner(cx-w/2,cy-h/2,w,h);
    x.restore();shieldPath(cx,cy,w,h);x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=2;x.stroke();
  }
  /* Springendes Pferd (Niedersachsen) */
  function horse(col,cx,cy,s){
    EL(col,cx,cy,22*s,11*s,-0.35);
    PG(col,[cx+12*s,cy-10*s,cx+22*s,cy-30*s,cx+30*s,cy-32*s,cx+34*s,cy-24*s,cx+24*s,cy-20*s,cx+18*s,cy-4*s]);
    LN(col,5*s,[cx+10*s,cy+2*s,cx+24*s,cy-10*s,cx+30*s,cy-4*s]);
    LN(col,5*s,[cx+4*s,cy+4*s,cx+14*s,cy-4*s,cx+22*s,cy+2*s]);
    LN(col,5*s,[cx-14*s,cy+6*s,cx-18*s,cy+22*s,cx-12*s,cy+30*s]);
    LN(col,5*s,[cx-20*s,cy+2*s,cx-28*s,cy+18*s,cx-24*s,cy+28*s]);
    LN(col,4*s,[cx-20*s,cy-4*s,cx-32*s,cy-2*s,cx-36*s,cy+12*s]);
  }
  /* Aufrechter Bär (Berlin) */
  function bear(col,cx,cy,s){
    EL(col,cx,cy+4*s,15*s,24*s,0.15);
    CI(col,cx-4*s,cy-24*s,10*s);
    PG(col,[cx-10*s,cy-26*s,cx-24*s,cy-22*s,cx-12*s,cy-18*s]);
    CI(col,cx+1*s,cy-33*s,4*s);
    LN(col,7*s,[cx-8*s,cy-8*s,cx-24*s,cy-18*s]);

function flagURL(c){if(!flagCache[c.id])flagCache[c.id]=drawFlag(c);return flagCache[c.id];}

function buildQs(c){
  var others=C.filter(function(x){return x!==c;});
  var qs=[];
  qs.push({type:'flag',t:'Welche Flagge gehört '+c.zu+'?',ans:c.id,flags:shuffle(shuffle(others).slice(0,3).concat([c]))});
  var caps=shuffle(others.filter(function(x){return x.cap!==c.cap;})).slice(0,3).map(function(x){return x.cap;});
  var qt=c.city?(c.name+' ist ein Stadtstaat: Stadt und Bundesland zugleich. Wie heißt die Hauptstadt?'):('Wie heißt die Hauptstadt '+c.von+'?');
  qs.push({t:qt,ans:c.cap,opts:shuffle(caps.concat([c.cap]))});
  return qs;
}
function startLanding(c){
  state='landing';curPin=c.pin;lockId=c.id;nearC=null;$('land').classList.add('hidden');
  input.left=input.right=input.boost=input.slow=false;
  tone([392,523,659]);

}
function openQuiz(c,qs){
  var qi=0,mistakes=0,gained=0,first=!visited[c.id];
  var ov=$('ov');ov.classList.remove('hidden');
  function next(){qi++;if(qi<qs.length)renderQ(qs[qi]);else finish();}
  function renderQ(q){
    var tries=0,done=false;
    ov.innerHTML='';
    var card=document.createElement('div');card.className='card';
    var sm=document.createElement('div');sm.className='small';sm.textContent='🛬 Gelandet '+c.inn+'!  ·  Aufgabe '+(qi+1)+' von '+qs.length;
    var h=document.createElement('h2');h.textContent=q.t;
    var wrap=document.createElement('div');
    var fb=document.createElement('div');fb.className='fb';
    card.appendChild(sm);card.appendChild(h);card.appendChild(wrap);card.appendChild(fb);ov.appendChild(card);
    function answer(b,ok){
      if(done||b.disabled)return;
      if(ok){
        done=true;b.classList.add('good');
        var pts=tries===0?10:(tries===1?5:(tries===2?2:0));
        if(first)gained+=pts;
        mistakes+=tries;
        fb.textContent=tries===0?'✅ Richtig! Super!':'✅ Richtig!';
        tone([660,880]);
        setTimeout(next,1100);
      }else{
        tries++;b.classList.add('bad');b.disabled=true;
        fb.textContent='Fast! Probier es nochmal 🙂';tone([220]);
      }
    }
    if(q.type==='flag'){
      wrap.className='flags';
      q.flags.forEach(function(f){
        var b=document.createElement('button');b.className='opt flagopt';
        var im=document.createElement('img');im.src=flagURL(f);im.alt='Flagge';
        b.appendChild(im);
        b.addEventListener('click',function(){answer(b,f.id===q.ans);});
        wrap.appendChild(b);
      });
    }else{
      q.opts.forEach(function(o){
        var b=document.createElement('button');b.className='opt';b.textContent=o;
        b.addEventListener('click',function(){answer(b,o===q.ans);});
        wrap.appendChild(b);
      });
    }
  }
  function finish(){
    var stars=mistakes===0?3:(mistakes<=2?2:1);
    if(first){visited[c.id]=stars;score+=gained;save();melde();}
    else if(stars>(visited[c.id]||0)){visited[c.id]=stars;save();}
    updateScore();refreshPins();
    tone([523,659,784,1047]);
    ov.innerHTML='';
    var card=document.createElement('div');card.className='card';
    var all=visitedCount()>=NC;
    var capLine=c.city?('🏙️ '+c.name+' ist ein <b>Stadtstaat</b>: Die Stadt ist zugleich ein Bundesland.'):('🏙️ Die Hauptstadt '+c.von+' ist <b>'+c.cap+'</b>.');
    card.innerHTML='<div class="stars">'+'⭐'.repeat(stars)+'<span style="opacity:.25">'+'⭐'.repeat(3-stars)+'</span></div>'+
      '<h2>Geschafft: '+c.name+'!</h2>'+
      '<img class="bigflag" alt="Flagge '+c.von+'" src="'+flagURL(c)+'">'+
      '<p>'+capLine+'</p>'+
      '<p>💡 '+c.fact+'</p>'+
      '<p class="small">'+(first?('+'+gained+' Punkte'):'Geübt – Punkte gibt es nur beim ersten Mal')+'</p>';
    var b=document.createElement('button');b.className='btn';b.textContent=all?'🏆 Zum Ziel!':'Weiterfliegen ✈️';
    b.addEventListener('click',function(){
      ov.classList.add('hidden');
      if(all){showWin();return;}
      if((target&&target.id===c.id)||!target)chooseTarget(false);
      refreshPins();
      state='fly';
    });
    card.appendChild(b);ov.appendChild(card);
    if(all){target=null;}
  }
  renderQ(qs[0]);
}
function homeBtn(card){var home=document.createElement('a');home.className='btn alt';home.href='../../#/';home.target='_top';home.textContent='🏠 Alle Spiele';card.appendChild(home);}

/* ---------- Hauptschleife ---------- */
var camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),dp=new THREE.Vector3(),dl=new THREE.Vector3();
var BX0=wx(4.5),BX1=wx(16.5),BZ0=wz(55.8),BZ1=wz(46.8);
var R_LAND=2.2;
var arrow=$('arrow'),miniCtx=$('mini').getContext('2d'),lastClampToast=0;

function update(dt,t){
  uniforms.uTime.value=t;
  var flying=(state==='fly'||state==='menu');
  var tgtTurn=0;
  if(state==='menu'){tgtTurn=0.28;}
  else if(state==='fly'){tgtTurn=(input.right?1:0)-(input.left?1:0);}
  if(flying){
    P.turn+=(tgtTurn-P.turn)*Math.min(1,dt*6);
    P.yaw+=P.turn*1.5*dt;
    var sp=5.4*(input.boost?1.8:(input.slow?0.5:1));
    P.x+=Math.sin(P.yaw)*sp*dt;P.z-=Math.cos(P.yaw)*sp*dt;
    P.y+=(3.2-P.y)*Math.min(1,dt*1.6);
    var cx=Math.min(BX1,Math.max(BX0,P.x)),cz=Math.min(BZ1,Math.max(BZ0,P.z));
    if((cx!==P.x||cz!==P.z)&&state==='fly'&&t-lastClampToast>2.5){toast('Hier endet die Karte – dreh um! 🔄');lastClampToast=t;}
    P.x=cx;P.z=cz;
  }else if(state==='landing'||state==='quiz'||state==='win'){
    P.turn+=(0-P.turn)*Math.min(1,dt*4);
    if(curPin){var k=Math.min(1,dt*2.4);P.x+=(curPin.x-P.x)*k;P.z+=(curPin.z-P.z)*k;}
    P.y+=(0.55-P.y)*Math.min(1,dt*2.2);
  }
  var pitch=Math.max(-0.35,Math.min(0.3,(3.2-P.y)*0.12*(flying?1:-1)));
  if(!flying)pitch=Math.max(-0.3,Math.min(0.2,(P.y-0.55)*-0.08));
  plane.position.set(P.x,P.y,P.z);
  plane.rotation.set(pitch,-P.yaw,-P.turn*0.6);
  prop.rotation.z+=dt*45;
  shadow.position.set(P.x,0.05,P.z);shadow.rotation.z=-P.yaw;
  var ss=Math.max(0.5,1.3-P.y*0.12);shadow.scale.set(ss*1.7,ss,1);

  /* Nähe zu einer Hauptstadt */
  if(state==='fly'){
    var best=null,bd=1e9;
    for(var i=0;i<NC;i++){var p=C[i].pin,dx=p.x-P.x,dz=p.z-P.z,d=dx*dx+dz*dz;
      if(d<bd){bd=d;best=C[i];}}
    if(lockId){var lp=C.filter(function(c){return c.id===lockId;})[0];if(lp){var ddx=lp.pin.x-P.x,ddz=lp.pin.z-P.z;if(ddx*ddx+ddz*ddz>(R_LAND+1.2)*(R_LAND+1.2))lockId=null;}}
    if(best&&bd<R_LAND*R_LAND&&best.id!==lockId){
      if(nearC!==best){nearC=best;$('land').textContent='🛬 '+best.inn.charAt(0).toUpperCase()+best.inn.slice(1)+' landen';$('land').classList.remove('hidden');}
    }else if(nearC){nearC=null;$('land').classList.add('hidden');}
  }

  /* Kamera */
  if(state==='landing'||state==='quiz'||state==='win'){
    var cp=curPin||{x:P.x,z:P.z};
    dp.set(cp.x+3.2,1.9,cp.z+4.4);dl.set(cp.x,0.8,cp.z);
  }else{
    var fx=Math.sin(P.yaw),fz=-Math.cos(P.yaw);
    dp.set(P.x-fx*6.8,P.y+2.7,P.z-fz*6.8);dl.set(P.x+fx*9,P.y-1.0,P.z+fz*9);
  }
  var kk=1-Math.exp(-dt*(flying?7:2.2));
  camPos.lerp(dp,kk);camLook.lerp(dl,kk);
  camera.position.copy(camPos);camera.lookAt(camLook);

  /* Pins, Strahl, Beschriftungen, Wolken */
  var pulse=1+0.18*Math.sin(t*5);
  for(var j=0;j<NC;j++){
    var c=C[j];
    c.pin.ball.scale.setScalar(c===target?pulse*1.25:1);
    c.pin.ring.scale.setScalar(c===target?1+0.25*Math.sin(t*4):1);
    var ddx2=c.label.position.x-P.x,ddz2=c.label.position.z-P.z;
    var dd=Math.sqrt(ddx2*ddx2+ddz2*ddz2);
    c.label.material.opacity=Math.max(0,Math.min(1,1.25-dd/17));
    c.label.visible=c.label.material.opacity>0.02;
  }
  if(window.__beam&&target){var bdx=target.pin.x-camera.position.x,bdz=target.pin.z-camera.position.z,bdd=Math.sqrt(bdx*bdx+bdz*bdz);window.__beam.material.opacity=(0.3+0.12*Math.sin(t*4))*Math.min(1,Math.max(0,(bdd-3)/4));}
  window.__clouds.forEach(function(cl){cl.position.x+=cl.userData.v*dt;if(cl.position.x>MW/2+5)cl.position.x=-MW/2-5;});

  /* HUD */
  if(target&&(state==='fly'||state==='menu')){
    var tx=target.pin.x-P.x,tz=target.pin.z-P.z;
    var bearing=Math.atan2(tx,-tz);
    arrow.style.transform='rotate('+((bearing-P.yaw)*180/Math.PI).toFixed(1)+'deg)';
    $('tgtDist').textContent='ca. '+(Math.round(Math.hypot(tx,tz)*KM_PER_UNIT/10)*10)+' km';
  }
  drawMini(t);
}
function drawMini(t){
  if(!window.__mini||$('mini').classList.contains('hidden'))return;
  var cv=$('mini'),w=cv.width,h=cv.height;
  miniCtx.drawImage(window.__mini,0,0,w,h);
  function m(x,z){return [(x+MW/2)/MW*w,(z+MH/2)/MH*h];}
  C.forEach(function(c){
    var p=m(c.pin.x,c.pin.z);
    miniCtx.beginPath();miniCtx.arc(p[0],p[1],visited[c.id]?6:4.5,0,6.283);
    miniCtx.fillStyle=visited[c.id]?'#1fae55':'#ffffff';miniCtx.fill();
    miniCtx.lineWidth=1.5;miniCtx.strokeStyle='#16324f';miniCtx.stroke();
  });
  if(target){
    var q=m(target.pin.x,target.pin.z),r=8+4*Math.abs(Math.sin(t*4));
    miniCtx.beginPath();miniCtx.arc(q[0],q[1],r,0,6.283);miniCtx.lineWidth=3;miniCtx.strokeStyle='#ff9f1c';miniCtx.stroke();
  }
  var pp=m(P.x,P.z);
  miniCtx.save();miniCtx.translate(pp[0],pp[1]);miniCtx.rotate(P.yaw);
  miniCtx.beginPath();miniCtx.moveTo(0,-11);miniCtx.lineTo(8,9);miniCtx.lineTo(0,5);miniCtx.lineTo(-8,9);miniCtx.closePath();
  miniCtx.fillStyle='#e53935';miniCtx.fill();miniCtx.lineWidth=2;miniCtx.strokeStyle='#fff';miniCtx.stroke();miniCtx.restore();
}

function frame(now){
  raf=0;
  if(paused)return;                      /* Pause: kein Zeichnen, das Gerät bleibt kühl */
  raf=requestAnimationFrame(frame);
  /* Menü und offene Fenster (Fragen, Gewinn): die Szene lebt nur mit 20 Bildern/s weiter */
  if(state!=='fly'&&state!=='landing'&&now&&now-lastDraw<50)return;
  lastDraw=now||0;
  var raw=clock.getDelta(),dt=Math.min(raw,0.05);
  if(quality&&state==='fly')quality.frame(raw);
  update(dt,clock.elapsedTime);
  renderer.render(scene,camera);
}

   „Alle Spiele“, Pause-Fenster, automatische Pause im Hintergrund, Detailstufe auf schwachen Geräten.
   Der Ton-Knopf der Leiste schaltet die gemeinsame Ton-Einstellung aller Spiele (muted). ---------- */
var kit=null,quality=null,paused=false,raf=0,lastDraw=0;
function kitState(){if(kit)kit.setState(state==='menu'||state==='loading'?'menu':state==='win'?'end':'play');}
import('../shared/kit/kit.js').then(function(m){
  kit=m.startKit({key:'deutschlandflug',orientation:'any',
    pause:function(){paused=true;},
    resume:function(){paused=false;clock.getDelta();if(!raf)frame();},
    sound:{setMuted:function(v){muted=v;}}});
  quality=m.createQuality({renderer:renderer});
  kitState();
}).catch(function(){});

/* ---------- Start ---------- */
load();
setTimeout(function(){
  try{
    buildMap();buildWorld();
  }catch(e){
    $('loading').textContent='Leider ist beim Laden ein Fehler passiert: '+e.message;
    return;
  }
  var fx=Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  camPos.set(P.x-fx*6.8,P.y+2.7,P.z-fz*6.8);camLook.set(P.x+fx*9,P.y-1.0,P.z+fz*9);
  state='menu';
  updateScore();
  $('loading').classList.add('hidden');
  showStart();
  frame();
},30);
})();
</script>
</body>
