<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/zoom-schutz.js"></script>
<script src="../shared/game-test.js"></script>
<link rel="stylesheet" href="../shared/kit/theme.css">
<title>Die Formen-Werkstatt</title>
<style>
/* Die Formen-Werkstatt – Geometrie für die 3. Klasse (Bildungsplan BW 2016, Mathe 3.2.2 Raum und Form).
   Füchsin Tilda baut eine Rakete. Für jeden gelösten Auftrag gibt es ein Bauteil. */
:root{--ink:#1d2b4f;--accent:#ff7a2f;--ok:#3fae5a;--bad:#e2604f;--paper:#fffaf2;--line:#e8d9c2}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;height:var(--gt-vh,100dvh);
  background:radial-gradient(circle,rgba(120,82,40,.13) 2px,transparent 2.5px) 0 0/26px 26px,linear-gradient(#f6d7a7,#fbe9cc 60%,#f3d3a2)}
.bar{display:flex;align-items:center;justify-content:flex-start;gap:8px;min-height:calc(var(--gt-top) + 54px);
  padding:var(--gt-top) calc(var(--gt-bar-space) + 4px) 6px 12px}
.pill{background:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:16px;color:inherit;
  text-decoration:none;box-shadow:0 3px 10px rgba(80,50,20,.22);display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:40px}
.pill svg{width:22px;height:30px}
main{flex:1;min-height:0;display:flex;padding:calc(var(--gt-top) + 54px) 12px calc(16px + env(safe-area-inset-bottom));
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
body.im-spiel main{padding-top:8px}   /* im Spiel hält die Kopfzeile oben den Platz für die Leiste des Kits frei */
.card{margin:auto;background:var(--paper);border-radius:24px;padding:20px;width:100%;box-shadow:0 8px 26px rgba(80,50,20,.28);border:3px solid #fff}
h1{margin:4px 0 8px;font-size:clamp(26px,5vw,38px);text-align:center}
p{font-size:18px;line-height:1.4;margin:8px 0}
.btn{display:block;width:100%;margin:10px 0 0;padding:13px 18px;min-height:52px;font:inherit;font-size:19px;font-weight:700;text-align:center;
  color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;cursor:pointer;text-decoration:none}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

/* Start */
.start{max-width:760px}
.hero{display:flex;align-items:center;justify-content:center;gap:14px}
.hero svg{width:70px;height:98px;flex:none}
.say{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 14px;position:relative;max-width:470px}
.say b{color:var(--accent)}
.pick{text-align:center;font-weight:700;margin-top:14px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.topic{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;min-height:64px;font:inherit;color:inherit;background:#fff;
  border:3px solid var(--line);border-radius:16px;cursor:pointer}
@media (hover:hover) and (pointer:fine){.topic:hover{border-color:var(--accent)}}
.topic .ti{font-size:30px;flex:none;width:38px;text-align:center}
.topic b{display:block;font-size:18px}
.topic small{display:block;font-size:14px;opacity:.75}
.topic .st{margin-left:auto;font-size:14px;white-space:nowrap}
.topic.mix{background:#fff3e3}

/* Spiel */
.game{max-width:1060px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);padding:14px}
#vis{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;
  min-height:160px;overflow:hidden;padding:8px}
#vis svg.big{display:block;width:100%;height:auto;max-height:min(40vh,330px)}
#vis.is3d{padding:0;height:min(42vh,340px);background:linear-gradient(#eef6ff,#fff)}
#vis canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#vis canvas:active{cursor:grabbing}
.chip{position:absolute;bottom:8px;background:rgba(255,255,255,.92);border:2px solid var(--line);border-radius:999px;padding:5px 11px;
  font:inherit;font-size:14px;font-weight:700;color:var(--ink);pointer-events:none}
.chip.hint{left:8px;top:8px;bottom:auto}
.chip.again{right:8px;pointer-events:auto;cursor:pointer;font-size:15px;padding:7px 12px}
.panel{display:flex;flex-direction:column;justify-content:center;min-width:0}
#prompt{margin:0 0 10px;font-size:clamp(20px,3.2vw,26px);line-height:1.25;text-align:center}
#opts{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
#opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
#opts.one{grid-template-columns:minmax(0,1fr)}
.opt{min-height:62px;font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:16px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;line-height:1.15}
@media (hover:hover) and (pointer:fine){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt .num{font-size:28px}
.opt .let{font:700 44px/1 Arial,Helvetica,sans-serif}
.opt .oi{width:40px;height:40px}
.opt svg.oimg{width:100%;height:auto;max-height:118px}
.opt small{font-size:13px;font-weight:400}
.opt.right{background:#dcf5d7;border-color:var(--ok)}
.opt.wrong{background:#ffe3de;border-color:var(--bad);opacity:.65}
.opt:disabled{cursor:default}
.opt.check{background:var(--accent);border-color:var(--accent);color:#fff}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:6px;border:2px solid var(--ink)}
#fb{min-height:52px;font-weight:700;font-size:18px;margin:10px 0 0;text-align:center}
#fb.good{color:#23753a}
#fb.bad{color:#a8382b}
@media (min-width:700px) and (orientation:landscape){
  .game{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);align-items:stretch}
  #vis svg.big{max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px)}
  #vis.is3d{height:calc(100vh - 120px);height:calc(100dvh - 120px);max-height:480px;min-height:240px}
}
@media (max-height:500px) and (orientation:landscape){
  .game{padding:10px;gap:10px} #prompt{font-size:19px;margin-bottom:6px} .opt{min-height:50px} #fb{min-height:40px;font-size:16px;margin-top:6px}
  .btn{min-height:46px;padding:9px 14px;margin-top:6px} .opt svg.oimg{max-height:84px}
}

/* Hilfen, die nach der richtigen Antwort erscheinen */
.corner,.axis{opacity:0;transition:opacity .4s}
.reveal .corner,.reveal .axis{opacity:1}
.reveal .hit{stroke:#e2604f;stroke-width:7;animation:pulse 1s ease-in-out 3}
.reveal .rim line{stroke:#ff7a2f;stroke-width:4.5}
@keyframes pulse{50%{opacity:.45}}

/* Gitter zum Spiegeln */
svg.grid rect{stroke:#c9d3e2;stroke-width:.35}
svg.grid rect.off{fill:#eef1f6}
svg.grid rect.tap{fill:#fff;cursor:pointer}
@media (hover:hover) and (pointer:fine){svg.grid rect.tap:hover{fill:#fff1e2}}
svg.grid rect.giv{fill:#ff9f55}
svg.grid rect.tap.on{fill:#4aa3df}
svg.grid rect.miss{stroke:#e2604f;stroke-width:1.1;stroke-dasharray:1.6 1}
svg.grid rect.extra{fill:#f3a79b}

/* Gewinn */
.win{max-width:560px;text-align:center}
.launch{height:210px;display:flex;align-items:flex-end;justify-content:center}
.launch svg{width:120px;height:168px;animation:hover 1.6s ease-in-out infinite}
.launch .fl{animation:flick .18s infinite alternate;transform-origin:50px 111px}
@keyframes hover{50%{transform:translateY(-14px)}}
@keyframes flick{to{transform:scaleY(.8)}}
.stars{font-size:46px;letter-spacing:6px;min-height:56px}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
@keyframes pop{from{transform:scale(0)}}
.got{animation:pop .5s}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <span class="pill" id="progBox"><span id="mini"></span><span id="progress"></span></span>
</div>
<main>
  <section class="card start" id="start">
    <h1>Die Formen-Werkstatt</h1>
    <div class="hero">
      <span id="heroRocket"></span>
      <p class="say">🦊 Hallo, ich bin <b>Tilda</b>! In meiner Werkstatt baue ich eine Rakete.
        Hilf mir bei <b>10 Aufträgen</b> rund um Formen und Körper. Für jeden Auftrag bekommst du ein Bauteil.</p>
    </div>
    <p class="pick">Wähle ein Thema:</p>
    <div class="topics" id="topics"></div>
    <a class="btn" href="../../#/" target="_top">🏠 Alle Spiele</a>
  </section>

  <section class="card game" id="game" hidden>
    <div id="vis"></div>
    <div class="panel">
      <h2 id="prompt"></h2>
      <div id="opts"></div>
      <p id="fb" aria-live="polite"></p>
      <button class="btn main" id="nextBtn" hidden>Weiter ➜</button>
    </div>
  </section>

  <section class="card win" id="win" hidden>
    <div class="launch" id="winRocket"></div>
    <h1>Die Rakete ist fertig!</h1>
    <div class="stars" id="stars"></div>
    <p id="winText"></p>
    <p id="winResult"></p>
    <button class="btn main" id="againBtn">🔄 Nochmal spielen</button>
    <button class="btn" id="menuBtn">🧩 Anderes Thema</button>
    <a class="btn" href="../../#/" target="_top">🏠 Alle Spiele</a>
  </section>
</main>

<script src="../shared/vendor/three-r128.min.js"></script>
<script>
(function () {
  'use strict';
  var SAVE = 'mathe_formen_v1';
  var TEST = /[?&]test\b/.test(location.search);
  var TASKS = 10;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- kleine Helfer ---------- */
  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function k2(c) { return c[0] + ',' + c[1]; }
  function setOf(cells) { var S = {}; cells.forEach(function (c) { S[k2(c)] = 1; }); return S; }
  function bbox(cells) {
    var b = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
    cells.forEach(function (c) { b.x0 = Math.min(b.x0, c[0]); b.y0 = Math.min(b.y0, c[1]); b.x1 = Math.max(b.x1, c[0]); b.y1 = Math.max(b.y1, c[1]); });
    return b;
  }
  function norm(cells) { var b = bbox(cells); return cells.map(function (c) { return [c[0] - b.x0, c[1] - b.y0]; }); }
  function cellKey(cells) { return norm(cells).map(k2).sort().join(' '); }
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16), f = function (v) { return Math.max(0, Math.min(255, v + amt)); };
    return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f((n >> 8) & 255) << 8) + f(n & 255)).toString(16).slice(1);
  }
  var INK = '#1d2b4f';
  var COLORS = ['#ff9f55', '#7cc0f0', '#8fd88a', '#f6cf55', '#c59be6', '#f28fa8', '#6fd3c4'];
  var PRAISE = ['Richtig!', 'Super!', 'Genau!', 'Klasse!', 'Prima!'];
  var OOPS = ['Noch nicht ganz.', 'Fast!', 'Hmm, nicht ganz.'];

  function svg(vb, body, cls) { return '<svg viewBox="' + vb + '" class="' + (cls || '') + '" aria-hidden="true">' + body + '</svg>'; }
  function pts(p) { return p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rot(p, cx, cy, deg) {
    var a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return p.map(function (q) { var x = q[0] - cx, y = q[1] - cy; return [cx + x * c - y * s, cy + x * s + y * c]; });
  }

  /* Antworten: Zahlen aufsteigend, sonst gemischt */
  function numOpts(ans, cands) {
    var out = [ans];
    (cands || []).concat([ans + 1, ans - 1, ans + 2, ans - 2, ans + 3, ans + 4]).forEach(function (c) {
      if (out.length < 3 && c >= 0 && out.indexOf(c) < 0) out.push(c);
    });
    return out.sort(function (a, b) { return a - b; }).map(function (v) { return { html: '<b class="num">' + v + '</b>', ok: v === ans, v: v }; });
  }
  function textOpts(right, wrongs, icon) {
    return shuffle([right].concat(wrongs)).map(function (t) { return { html: (icon ? icon(t) : '') + '<span>' + t + '</span>', ok: t === right, v: t }; });
  }
  function picOpts(list) { return shuffle(list.slice()); }

  /* ---------- Speicherstand ---------- */
  function load() {
    var d = null;
    try { d = JSON.parse(localStorage.getItem(SAVE)); } catch (e) {}
    d = d && typeof d === 'object' ? d : {};
    d.best = d.best && typeof d.best === 'object' ? d.best : {};
    d.lvl = d.lvl && typeof d.lvl === 'object' ? d.lvl : {};
    d.mute = !!d.mute;
    return d;
  }
  var store = load();
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(store)); } catch (e) {} }

  /* ---------- Töne ---------- */
  var AC = null;
  function beep(f, d, type, vol, delay) {
    if (store.mute) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || .14, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  }
  function sndRight() { beep(660, .14); beep(880, .22, 'sine', .14, .11); }
  function sndWrong() { beep(240, .28, 'triangle', .12); }
  function sndTap() { beep(520, .06, 'square', .04); }
  function sndWin() { [523, 659, 784, 1046].forEach(function (f, i) { beep(f, .25, 'sine', .13, i * .14); }); }

  /* ---------- Rakete (Fortschritt) ---------- */
  var PARTS = [
    ['polygon', 'points="32,74 12,108 32,102"', '#e2604f'],
    ['polygon', 'points="68,74 88,108 68,102"', '#e2604f'],
    ['rect', 'x="32" y="40" width="36" height="62" rx="2"', '#e9eef6'],
    ['polygon', 'points="50,8 32,40 68,40"', '#e2604f'],
    ['circle', 'cx="50" cy="58" r="9"', '#4aa3df'],
    ['rect', 'x="43" y="76" width="14" height="14"', '#f6cf55'],
    ['rect', 'x="38" y="102" width="24" height="9"', '#7b8794'],
    ['polygon', 'points="38,111 62,111 50,136"', '#ff8a3d', 'fl'],
    ['polygon', 'points="44,111 56,111 50,127"', '#ffe066', 'fl'],
    ['circle', 'cx="50" cy="5" r="3.5"', '#f6cf55']
  ];
  var EARN = [2, 3, 4, 0, 1, 5, 6, 7, 8, 9];   /* Reihenfolge, in der die Teile dazukommen */
  function rocketSVG(k, newest) {
    var rank = {}; EARN.forEach(function (p, i) { rank[p] = i; });
    return svg('0 0 100 140', PARTS.map(function (p, i) {
      var have = rank[i] < k, cls = [p[3] || '', have && rank[i] === newest ? 'got' : ''].join(' ').trim();
      return '<' + p[0] + ' ' + p[1] + (cls ? ' class="' + cls + '"' : '') + (have ? ' fill="' + p[2] + '" stroke="' + INK + '" stroke-width="2.5"' :
        ' fill="rgba(255,255,255,.5)" stroke="#a89377" stroke-width="2" stroke-dasharray="4 3"') +
        (have && rank[i] === newest ? ' style="transform-box:fill-box;transform-origin:center"' : '') +
        ' stroke-linejoin="round"/>';
    }).join(''));
  }

  /* =====================================================================
     3D-Ansicht (Three.js r128): ein Zeichenfeld, das bei Bedarf eingeblendet wird.
     Ziehen dreht den Körper, ohne Ziehen dreht er sich bei manchen Aufgaben langsam.
     ===================================================================== */
  var T3 = { ok: false };
  function init3D() {
    if (!window.THREE) return;
    try {
      var c = document.createElement('canvas');
      var r = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true });
      r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      var scene = new THREE.Scene();
      var cam = new THREE.PerspectiveCamera(35, 1, .1, 100);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb8a890, .75));
      scene.add(new THREE.AmbientLight(0xffffff, .25));
      var dl = new THREE.DirectionalLight(0xffffff, .55); dl.position.set(3, 6, 5); scene.add(dl);
      var pivot = new THREE.Group(); scene.add(pivot);
      T3 = { ok: true, canvas: c, r: r, scene: scene, cam: cam, pivot: pivot, yaw: 0, pitch: .5, size: 2, auto: false, touched: false, anim: null, raf: 0, last: 0, box: null };
      var drag = null;
      c.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY }; T3.touched = true; try { c.setPointerCapture(e.pointerId); } catch (er) {} });
      c.addEventListener('pointermove', function (e) {
        if (!drag) return;
        T3.yaw += (e.clientX - drag.x) * .012;
        T3.pitch = Math.max(-.15, Math.min(1.45, T3.pitch + (e.clientY - drag.y) * .009));
        drag = { x: e.clientX, y: e.clientY };
      });
      ['pointerup', 'pointercancel'].forEach(function (n) { c.addEventListener(n, function () { drag = null; }); });
      window.addEventListener('resize', resize3D);
    } catch (e) { T3 = { ok: false }; }
  }
  function clear3D() {
    var p = T3.pivot;
    while (p.children.length) {
      var ch = p.children.pop();
      ch.traverse(function (o) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
      });
    }
  }
  function show3D(box, v) {
    clear3D();
    var g = new THREE.Group(); T3.pivot.add(g); v.build(g);
    T3.yaw = v.yaw != null ? v.yaw : .6; T3.pitch = v.pitch != null ? v.pitch : .5; T3.size = v.size || 2;
    T3.auto = !!v.auto; T3.touched = false; T3.anim = null; T3.box = box;
    box.classList.add('is3d');
    box.appendChild(T3.canvas);
    var h = document.createElement('span'); h.className = 'chip hint'; h.textContent = '👆 Ziehen zum Drehen'; box.appendChild(h);
    resize3D();
    if (!T3.raf) { T3.last = performance.now(); T3.raf = requestAnimationFrame(frame); }
  }
  function stop3D() {
    if (!T3.ok) return;
    if (T3.raf) cancelAnimationFrame(T3.raf);
    T3.raf = 0; T3.anim = null; T3.box = null;
    if (T3.canvas.parentNode) T3.canvas.parentNode.removeChild(T3.canvas);
  }
  function resize3D() {
    if (!T3.ok || !T3.box) return;
    var w = Math.max(50, T3.box.clientWidth), h = Math.max(50, T3.box.clientHeight), cam = T3.cam;

  function camFit() {

    var half = cam.fov * Math.PI / 360, hh = Math.atan(Math.tan(half) * cam.aspect);

    if (T3.anim) T3.anim(dt);

    T3.r.render(T3.scene, T3.cam);
  }
  function mat(color, extra) {
    var o = { color: color }; for (var k in extra || {}) o[k] = extra[k];
    o.polygonOffset = true; o.polygonOffsetFactor = o.polygonOffsetFactor || 1; o.polygonOffsetUnits = o.polygonOffsetUnits || 1;
    return new THREE.MeshLambertMaterial(o);
  }
  function lineMat() { return new THREE.LineBasicMaterial({ color: 0x1d2b4f }); }
  function textTex(txt, bg, fg, w, h, size) {
    var c = document.createElement('canvas'); c.width = w || 128; c.height = h || 128;
    var x = c.getContext('2d');
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height); }
    x.fillStyle = fg || '#1d2b4f'; x.font = 'bold ' + (size || 80) + 'px Trebuchet MS, Arial, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, c.width / 2, c.height / 2 + 4);
    return new THREE.CanvasTexture(c);

        exp: 'Super gespiegelt! Jedes Kästchen hat auf der anderen Seite den gleichen Abstand zur Spiegelachse.',
        tip: 'Tipp: Zähle bei jedem Kästchen, wie weit es von der roten Linie weg ist. Auf der anderen Seite gleich weit.'
      };
    }
  };

  var AT = {
    flaeche: function (s) {
      var fig, W, H, n, exp, rows;
      if (s === 3 && Math.random() < .6) {
        var a = ri(3, 5), b = ri(4, 7), rect = [];
        for (var y = 0; y < a; y++) for (var x = 0; x < b; x++) rect.push([x, y]);
        if (Math.random() < .5) { var cw = ri(1, b - 2), ch = ri(1, a - 1); rect = rect.filter(function (c) { return !(c[0] >= b - cw && c[1] < ch); }); }
        W = 9; H = 7; fig = center(rect, W, H); n = fig.length; rows = rowSum(fig);
        exp = rows.every(function (r) { return r === rows[0]; }) ? rows.length + ' Reihen mit je ' + rows[0] + ' Kästchen: ' + rows.length + ' · ' + rows[0] + ' = ' + n + '.' : 'Reihe für Reihe: ' + rows.join(' + ') + ' = ' + n + '.';
      } else {
        W = s === 1 ? 6 : 8; H = s === 1 ? 5 : 6; n = s === 1 ? ri(4, 8) : ri(7, 12); fig = polyFig(n, W, H); rows = rowSum(fig);
        exp = 'Die Figur ist ' + n + ' Kästchen groß. Reihe für Reihe: ' + rows.join(' + ') + ' = ' + n + '.';
      }
      return { key: 'af' + cellKey(fig), prompt: 'Wie viele Kästchen ist die Fläche groß?', vis: { svg: gridFig(fig, W, H, { color: pick(COLORS) }) }, opts: numOpts(n, [n + 1, n - 1, n + 2]), exp: exp, tip: 'Tipp: Zähle Reihe für Reihe und rechne zusammen.' };
    },
    umfang: function (s) {
      var W = s === 1 ? 6 : 8, H = s === 1 ? 5 : 6, n = s === 1 ? ri(3, 5) : s === 2 ? ri(4, 8) : ri(7, 11), fig = polyFig(n, W, H), p = perim(fig);
      var b = bbox(fig), rect = n === (b.x1 - b.x0 + 1) * (b.y1 - b.y0 + 1), w = b.x1 - b.x0 + 1, hh = b.y1 - b.y0 + 1;
      return {
        key: 'au' + cellKey(fig), prompt: 'Wie lang ist der Umfang? Zähle die Kästchenseiten am Rand.', vis: { svg: gridFig(fig, W, H, { color: pick(COLORS) }) },
        opts: numOpts(p, [p + 2, p - 2, n]),
        exp: rect ? 'Einmal rundherum: ' + w + ' + ' + hh + ' + ' + w + ' + ' + hh + ' = ' + p + ' Kästchenseiten.' : 'Einmal rundherum sind es ' + p + ' Kästchenseiten.',
        tip: 'Tipp: Fang an einer Ecke an. Fahre einmal außen herum und zähle jede Kästchenseite.'
      };
    },
    vergleich: function (s) {
      var big = Math.random() < .6, ns, figs;
      do { ns = s === 1 ? shuffle(range(6).map(function (i) { return i + 3; })).slice(0, 3) : [ri(6, 12), ri(6, 12), ri(6, 12)]; } while (new Set(ns).size < 3);
      figs = ns.map(function (n) { return polyFig(n, 5, 4); });
      var target = big ? Math.max.apply(null, ns) : Math.min.apply(null, ns), col = pick(COLORS);
      return {
        key: 'av' + ns.join('-'), prompt: 'Welche Figur hat die ' + (big ? 'größte' : 'kleinste') + ' Fläche?', vis: { svg: tildaSVG('📏') },
        opts: figs.map(function (f, i) { return { html: gridFig(f, 5, 4, { color: col, cls: 'oimg' }), ok: ns[i] === target, v: ns[i] }; }),
        exp: 'Die Figuren sind ' + ns.join(', ') + ' Kästchen groß. ' + target + ' ist am ' + (big ? 'meisten.' : 'wenigsten.'),
        tip: 'Tipp: Zähle bei jeder Figur die Kästchen.'
      };
    },
    gleich: function () {
      var n = ri(6, 8), figs = [], ps = [];
      for (var t = 0; t < 400 && figs.length < 3; t++) { var f = polyFig(n, 5, 4), p = perim(f); if (ps.indexOf(p) < 0) { figs.push(f); ps.push(p); } }
      var max = Math.max.apply(null, ps), col = pick(COLORS);
      return {
        key: 'ag' + ps.join('-'), prompt: 'Alle Figuren sind ' + n + ' Kästchen groß. Welche hat den längsten Umfang?', vis: { svg: tildaSVG('📏') },
        opts: figs.map(function (f, i) { return { html: gridFig(f, 5, 4, { color: col, cls: 'oimg' }), ok: ps[i] === max, v: ps[i] }; }),
        exp: 'Der Umfang ist ' + ps.join(', ') + ' Kästchenseiten. Gleiche Fläche heißt nicht gleicher Umfang!',
        tip: 'Tipp: Zähle bei jeder Figur die Kästchenseiten am Rand. Lange, dünne Figuren haben einen längeren Rand.'
      };
    },
    wuerfel: function (s) {
      var a = s === 2 ? ri(2, 3) : ri(2, 4), b = s === 2 ? 2 : ri(2, 3), c = s === 2 ? ri(1, 2) : ri(2, 3), layer = a * b, n = layer * c;
      var h = range(b).map(function () { return range(a).map(function () { return c; }); });
      return {
        key: 'aw' + a + b + c, prompt: 'Aus wie vielen Würfelchen besteht der Quader?', vis: vis3DBlocks(h, true),
        opts: numOpts(n, [n - layer, n + layer, layer + c]),
        exp: c === 1 ? 'Es ist eine Schicht: ' + a + ' · ' + b + ' = ' + n + ' Würfelchen.' : 'Eine Schicht hat ' + a + ' · ' + b + ' = ' + layer + ' Würfelchen. ' + c + ' Schichten: ' + range(c).map(function () { return layer; }).join(' + ') + ' = ' + n + '.',
        tip: 'Tipp: Zähle die Würfelchen in der obersten Schicht. Wie viele Schichten liegen übereinander?'
      };
    }
  };

  /* Tilda als Bild für Aufgaben, bei denen die Antworten Bilder sind */
  function tildaSVG(sym) {
    return svg('0 0 200 140', '<text x="78" y="104" text-anchor="middle" font-size="86">🦊</text><circle cx="150" cy="46" r="34" fill="#fff" stroke="#e8d9c2" stroke-width="4"/><path d="M122,66 L106,82 L132,72 Z" fill="#fff" stroke="#e8d9c2" stroke-width="4" stroke-linejoin="round"/><text x="150" y="60" text-anchor="middle" font-size="38">' + sym + '</text>', 'big tilda');
  }

  var GEN = {
    figuren: function (s) { return FIGT[pick(s === 1 ? ['name', 'name', 'ecken', 'alltag'] : s === 2 ? ['name', 'ecken', 'alltag', 'zaehlen', 'eigen'] : ['name', 'ecken', 'zaehlen', 'eigen', 'lage', 'lage'])](s); },
    koerper: function (s) { return KT[pick(s === 1 ? ['name', 'alltag'] : ['name', 'alltag', 'zahl', 'zahl', 'eigen'])](s); },
    netze: function (s) { return NT[pick(s === 1 ? ['janein'] : s === 2 ? ['janein', 'waehle', 'waehle'] : ['janein', 'waehle', 'gegen', 'gegen'])](s); },
    bauten: function (s) { var h = makeBuilding(s); return BT[pick(s === 1 ? ['zaehlen', 'zaehlen', 'oben'] : s === 2 ? ['zaehlen', 'oben', 'vorne', 'plan'] : ['zaehlen', 'vorne', 'plan', 'plan'])](s, h); },
    spiegel: function (s) { return ST[pick(s === 1 ? ['buchstabe', 'janein'] : s === 2 ? ['janein', 'ergaenzen', 'achse', 'buchstabe'] : ['ergaenzen', 'ergaenzen', 'achse', 'buchstabe'])](s); },
    flaeche: function (s) {
      var list = s === 1 ? ['flaeche', 'flaeche', 'vergleich', 'umfang'] : s === 2 ? ['flaeche', 'umfang', 'umfang', 'vergleich', 'wuerfel'] : ['flaeche', 'umfang', 'gleich', 'wuerfel', 'wuerfel'];
      if (!T3.ok) list = list.filter(function (t) { return t !== 'wuerfel'; });
      return AT[pick(list)](s);
    }
  };
  var TOPICS = [
    { id: 'figuren', icon: '🔺', name: 'Ebene Figuren', sub: 'Quadrat, Dreieck, Ecken, parallel' },
    { id: 'koerper', icon: '🧊', name: 'Körper', sub: 'Würfel, Kugel, Ecken und Kanten' },
    { id: 'netze', icon: '📦', name: 'Würfelnetze', sub: 'In Gedanken falten' },
    { id: 'bauten', icon: '🧱', name: 'Würfelbauten', sub: 'Zählen, Ansichten, Baupläne', need3d: true },
    { id: 'spiegel', icon: '🦋', name: 'Spiegeln', sub: 'Achsensymmetrie' },
    { id: 'flaeche', icon: '📐', name: 'Fläche und Umfang', sub: 'Kästchen zählen' },
    { id: 'mix', icon: '🎲', name: 'Bunt gemischt', sub: 'Aus allen Themen' }
  ];
  function availTopics() { return TOPICS.filter(function (t) { return t.id !== 'mix' && (!t.need3d || T3.ok); }).map(function (t) { return t.id; }); }

  /* =====================================================================
     Spielablauf
     ===================================================================== */
  var G = { screen: 'start', topic: null, n: 0, first: 0, task: null, tries: 0, solved: false, recent: [], lvl: {} };

  /* ---------- Game-Test-Kit (public/games/shared/kit/): Leiste mit Pause, Ton, Vollbild und „Alle Spiele“,
     Pause-Fenster, automatische Pause im Hintergrund. Ton an/aus ist die gemeinsame Einstellung aller Spiele. */
  var kit = null, pausiertSeit = 0;
  import('../shared/kit/kit.js').then(function (m) {
    kit = m.startKit({
      key: 'mathe-formen', orientation: 'any',
      pause: function () { pausiertSeit = Date.now(); },
      resume: function () { if (G.screen === 'game') G.start += Date.now() - pausiertSeit; },   /* Pause zählt nicht zur Zeit */
      sound: { setMuted: function (m) { store.mute = m; } }
    });
    kit.setState(G.screen === 'game' ? 'play' : G.screen === 'win' ? 'end' : 'menu');
  }).catch(function () {});
  function stage(t) { return Math.max(1, Math.min(3, Math.floor(G.lvl[t] || 1))); }
  function show(screen) {
    G.screen = screen;
    ['start', 'game', 'win'].forEach(function (id) { $(id).hidden = id !== screen; });
    $('bar').hidden = screen !== 'game';
    document.body.classList.toggle('im-spiel', screen === 'game');
    if (screen !== 'game') stop3D();
    document.querySelector('main').scrollTop = 0;
    if (kit) kit.setState(screen === 'game' ? 'play' : screen === 'win' ? 'end' : 'menu');
  }
  function starsText(n) { return n ? '⭐'.repeat(n) + '☆'.repeat(3 - n) : ''; }
  function renderTopics() {
    $('topics').innerHTML = '';
    TOPICS.forEach(function (t) {
      if (t.need3d && !T3.ok) return;
      var b = document.createElement('button');
      b.className = 'topic' + (t.id === 'mix' ? ' mix' : ''); b.setAttribute('data-topic', t.id);
      b.innerHTML = '<span class="ti">' + t.icon + '</span><span><b>' + t.name + '</b><small>' + t.sub + '</small></span><span class="st">' + starsText(store.best[t.id] || 0) + '</span>';
      b.addEventListener('click', function () { startGame(t.id); });
      $('topics').appendChild(b);
    });
  }
  function startGame(topic) {
    G.topic = topic; G.n = 0; G.first = 0; G.recent = []; G.lvl = {};
    G.fehler = 0; G.start = Date.now();   /* Game-Test: Fehlversuche und Zeit für die Bestenliste */
    availTopics().forEach(function (t) { G.lvl[t] = Math.max(1, (Number(store.lvl[t]) || 1) - .5); });
    show('game');
    nextTask();
  }
  function nextTask() {
    if (G.n >= TASKS) { win(); return; }
    var t = G.topic === 'mix' ? pick(availTopics()) : G.topic, s = stage(t), task, i = 0;
    do { task = GEN[t](s); i++; } while (G.recent.indexOf(task.key) >= 0 && i < 30);
    task.topic = t; task.stage = s;
    G.recent.push(task.key); G.task = task; G.tries = 0; G.solved = false;
    render(task);
  }
  function render(task) {
    stop3D();
    var vis = $('vis');
    vis.className = ''; vis.innerHTML = '';
    if (task.vis.three && T3.ok) show3D(vis, task.vis);
    else if (task.vis.grid) renderGrid(vis, task.vis.grid);
    else vis.innerHTML = task.vis.svg;
    $('prompt').textContent = task.prompt;
    var box = $('opts');
    box.innerHTML = '';
    if (task.grid) {
      box.className = 'one';
      var cb = document.createElement('button'); cb.className = 'opt check'; cb.innerHTML = '<span>✓ Fertig – prüfen</span>';
      cb.addEventListener('click', checkGrid); box.appendChild(cb);
    } else {
      box.className = task.opts.length === 2 ? 'two' : '';
      task.opts.forEach(function (o, i) {
        var b = document.createElement('button'); b.className = 'opt'; b.innerHTML = o.html; b.setAttribute('data-i', i);
        b.addEventListener('click', function () { choose(i); });
        box.appendChild(b);
      });
    }
    $('fb').textContent = ''; $('fb').className = '';
    $('nextBtn').hidden = true;
    $('progress').textContent = 'Auftrag ' + (G.n + 1) + ' / ' + TASKS;
    $('mini').innerHTML = rocketSVG(G.n);
  }
  function choose(i) {
    if (G.solved || !G.task.opts) return;
    var b = $('opts').children[i], o = G.task.opts[i];
    if (!b || b.disabled) return;
    if (o.ok) solved(b); else wrong(b, '');
  }
  function adjust(right) {
    var t = G.task.topic;
    G.lvl[t] = right ? Math.min(3.5, G.lvl[t] + .5) : Math.max(1, G.lvl[t] - 1);
    store.lvl[t] = G.lvl[t]; save();
  }
  function wrong(b, extra) {
    if (G.tries === 0) adjust(false);
    G.tries++; G.fehler++;
    if (b && !G.task.grid) { b.classList.add('wrong'); b.disabled = true; }
    $('fb').className = 'bad';
    $('fb').textContent = '🤔 ' + pick(OOPS) + ' ' + (extra ? extra + ' ' : '') + G.task.tip;
    sndWrong();
  }
  function solved(b) {
    G.solved = true;
    if (G.tries === 0) { G.first++; adjust(true); }
    b.classList.add('right');
    [].forEach.call($('opts').children, function (x) { x.disabled = true; });
    $('fb').className = 'good';
    $('fb').textContent = '✅ ' + pick(PRAISE) + ' ' + G.task.exp;
    $('vis').classList.add('reveal');
    if (G.task.onRight) G.task.onRight($('vis'));
    $('mini').innerHTML = rocketSVG(G.n + 1, G.n);
    $('nextBtn').hidden = false;
    $('nextBtn').textContent = G.n + 1 >= TASKS ? 'Zur Rakete 🚀' : 'Weiter ➜';
    try { $('nextBtn').focus({ preventScroll: true }); } catch (e) {}
    sndRight();
  }

  /* Gitter zum Spiegeln */
  function renderGrid(vis, sp) {
    var cs = 10, s = '', x, y;
    for (y = 0; y < sp.H; y++) for (x = 0; x < sp.W; x++) {
      var k = x + ',' + y, side = sp.axis === 'v' ? x >= sp.W / 2 : y >= sp.H / 2;
      s += '<rect data-c="' + k + '" x="' + x * cs + '" y="' + y * cs + '" width="' + cs + '" height="' + cs + '" class="' + (sp.given[k] ? 'giv' : side ? 'tap' + (sp.user[k] ? ' on' : '') : 'off') + '"/>';
    }
    s += sp.axis === 'v' ? '<line x1="' + sp.W * cs / 2 + '" y1="-1" x2="' + sp.W * cs / 2 + '" y2="' + (sp.H * cs + 1) + '"' : '<line x1="-1" y1="' + sp.H * cs / 2 + '" x2="' + (sp.W * cs + 1) + '" y2="' + sp.H * cs / 2 + '"';
    s += ' stroke="#e2604f" stroke-width="1.3" stroke-dasharray="3 2" pointer-events="none"/>';
    vis.innerHTML = svg('-1.5 -1.5 ' + (sp.W * cs + 3) + ' ' + (sp.H * cs + 3), s, 'big grid');
    vis.firstChild.addEventListener('click', function (e) {
      var r = e.target, k = r.getAttribute && r.getAttribute('data-c');
      if (!k || G.solved || !r.classList.contains('tap')) return;
      sp.user[k] = !sp.user[k];
      r.classList.toggle('on', !!sp.user[k]);
      [].forEach.call(vis.querySelectorAll('.miss,.extra'), function (m) { m.classList.remove('miss', 'extra'); });
      sndTap();
    });
  }
  function gridDiff(sp) {
    var miss = Object.keys(sp.need).filter(function (k) { return !sp.user[k]; }), extra = Object.keys(sp.user).filter(function (k) { return sp.user[k] && !sp.need[k]; });
    return { miss: miss, extra: extra };
  }
  function checkGrid() {
    if (G.solved) return;
    var sp = G.task.grid, d = gridDiff(sp), n = d.miss.length + d.extra.length, btn = $('opts').firstChild;
    if (!n) { solved(btn); return; }
    wrong(null, n === 1 ? 'Ein Kästchen stimmt noch nicht.' : n + ' Kästchen stimmen noch nicht.');
    if (G.tries >= 2) {
      d.miss.forEach(function (k) { var r = $('vis').querySelector('[data-c="' + k + '"]'); if (r) r.classList.add('miss'); });
      d.extra.forEach(function (k) { var r = $('vis').querySelector('[data-c="' + k + '"]'); if (r) r.classList.add('extra'); });
      $('fb').textContent += ' Die markierten Kästchen musst du ändern.';
    }
  }

  function win() {
    var stars = G.first >= 9 ? 3 : G.first >= 6 ? 2 : 1;
    store.best[G.topic] = Math.max(store.best[G.topic] || 0, stars); save();
    show('win');
    $('winRocket').innerHTML = rocketSVG(TASKS);
    $('stars').innerHTML = '<span>' + starsText(stars).split('').join('</span><span>') + '</span>';
    var topic = TOPICS.filter(function (t) { return t.id === G.topic; })[0];
    $('winText').textContent = 'Du hast alle 10 Aufträge geschafft – ' + G.first + ' davon gleich beim ersten Versuch. Tilda sagt Danke! 🦊' +
      (G.topic !== 'mix' ? ' Thema „' + topic.name + '“: Stufe ' + stage(G.topic) + ' von 3.' : '');
    /* Game-Test: Ergebnis zeigen und an die Bestenliste melden */
    var sek = Math.min(86400, Math.round((Date.now() - G.start) / 1000));
    $('winResult').textContent = 'Fehlversuche: ' + G.fehler + ' · Zeit: ' + (sek >= 60 ? Math.floor(sek / 60) + ' min ' + (sek % 60) + ' s' : sek + ' s');
    if (window.GameTest) GameTest.reportScore({ points: G.fehler, seconds: sek });
    sndWin();
  }

  /* ---------- Bedienung ---------- */
  $('nextBtn').addEventListener('click', function () { G.n++; nextTask(); });
  $('againBtn').addEventListener('click', function () { startGame(G.topic); });
  $('menuBtn').addEventListener('click', function () { renderTopics(); show('start'); });

  document.addEventListener('keydown', function (e) {
    if (G.screen !== 'game' || e.altKey || e.ctrlKey || e.metaKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && G.task && G.task.opts) { choose(n - 1); e.preventDefault(); }
  });

  init3D();
  $('heroRocket').innerHTML = rocketSVG(TASKS);
  renderTopics();
  show('start');

  if (TEST) {
    window.FORMEN = {
      GEN: GEN, HEX: HEX, NETS: NETS, NONNETS: NONNETS, EASY_NON: EASY_NON, isNet: isNet, rollFaces: rollFaces, isSym: isSym, perim: perim,
      has3D: function () { return T3.ok; }, state: function () { return G.screen; }, game: function () { return G; }, task: function () { return G.task; },
      right: function () { return G.task.opts ? G.task.opts.findIndex(function (o) { return o.ok; }) : -1; },
      fillGrid: function (correct) {
        var sp = G.task.grid; sp.user = {};
        Object.keys(sp.need).forEach(function (k) { sp.user[k] = true; });
        if (!correct) { var k = Object.keys(sp.need)[0]; delete sp.user[k]; }
        renderGrid($('vis'), sp);
      },
      store: function () { return store; },
      render: function (task, topic) { task.topic = topic || task.topic || 'figuren'; G.task = task; G.tries = 0; G.solved = false; render(task); },
      choose: choose
    };
  }
})();
</script>
